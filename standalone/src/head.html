<title>Performance360 Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left rail of academy sections + one working column; collapses to a top bar and drawer on phones. */
:root{
  --bg:#f3f7f3; --surface:#ffffff; --surface-2:#ecf3ed; --surface-3:#dfeae1; --line:#d6e2d9;
  --ink:#0f1f16; --ink-soft:#4b6152; --ink-faint:#7a8f80;
  --brand:#0b5a3a; --brand-hover:#094c31; --brand-2:#3fae4f; --brand-soft:#d5eedb; --on-brand:#ffffff;
  --logo-deep:#0b5a3a; --logo-bright:#3fae4f;
  --good:#2f8a43; --good-soft:#dcf2e1; --warn:#a75a07; --warn-soft:#fdf0dc; --bad:#b42318; --bad-soft:#fde4e1; --info:#1d5f86; --info-soft:#dfeef7;
  --shadow:0 1px 2px rgba(11,40,24,.06),0 4px 14px rgba(11,40,24,.05);
  --f-display:"Barlow Semi Condensed","Heebo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree","Heebo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a130e; --surface:#101c15; --surface-2:#15251c; --surface-3:#1c3125; --line:#24382c;
  --ink:#e4efe7; --ink-soft:#9fb5a7; --ink-faint:#6f8678;
  --brand:#4cc463; --brand-hover:#63d178; --brand-2:#7fd9a8; --brand-soft:#173a25; --on-brand:#05301f;
  --logo-deep:#7fd9a8; --logo-bright:#4cc463;
  --good:#6fd38a; --good-soft:#163a22; --warn:#f0a54a; --warn-soft:#3a2a12; --bad:#f97066; --bad-soft:#3d1a17; --info:#7cc0ea; --info-soft:#12293a;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a130e; --surface:#101c15; --surface-2:#15251c; --surface-3:#1c3125; --line:#24382c;
  --ink:#e4efe7; --ink-soft:#9fb5a7; --ink-faint:#6f8678;
  --brand:#4cc463; --brand-hover:#63d178; --brand-2:#7fd9a8; --brand-soft:#173a25; --on-brand:#05301f;
  --logo-deep:#7fd9a8; --logo-bright:#4cc463;
  --good:#6fd38a; --good-soft:#163a22; --warn:#f0a54a; --warn-soft:#3a2a12; --bad:#f97066; --bad-soft:#3d1a17; --info:#7cc0ea; --info-soft:#12293a;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.005em;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:28px} h2{font-size:20px} h3{font-size:16px;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink-soft)}
.brand b{color:var(--logo-bright)}
.logo{width:34px;height:34px;flex:none}
.navlabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);border:0;background:none;text-align:start;cursor:pointer;color:var(--ink-soft);font-weight:500;width:100%}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav .badge{margin-inline-start:auto}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--line)}
.me .who{min-width:0}.me .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top h1{font-size:22px}
.top .sub{color:var(--ink-soft);font-size:13px}
.top .actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.langbtn{font-weight:700;font-size:13px}
.tools{display:inline-flex;gap:6px;flex:none}
.logins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.logins{grid-template-columns:minmax(0,1fr)}}
.logintile{display:flex;gap:12px;align-items:flex-start;text-align:start;padding:14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;min-width:0}
.logintile:hover{border-color:var(--brand-2)}
.logintile svg{width:24px;height:24px;flex:none;color:var(--brand);margin-top:2px}
.logintile b{display:block;font-size:15px}
.logintile small{display:block;color:var(--ink-soft);font-size:12.5px;line-height:1.35;margin-top:2px}
.logintile[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.loginpanel{border-top:1px solid var(--line);padding-top:14px}
.landing{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center;max-width:1120px;margin:0 auto;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.pitch{display:flex;flex-direction:column;gap:18px}
.pitch-brand{font-family:var(--f-display);font-weight:700;font-size:24px}.pitch-brand b{color:var(--logo-bright)}
.pitch-h{font-size:40px;line-height:1.08;max-width:16ch}
.pitch-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.pitch-list li{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--ink-soft)}
.pitch-list svg{width:22px;height:22px;flex:none;color:var(--brand-2)}
.pitch-trial{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--brand)}.pitch-trial svg{width:20px;height:20px}
.authcard{display:flex;flex-direction:column;gap:14px;padding:24px}
.legal-links{border-top:1px solid var(--line);padding-top:12px;color:var(--ink-soft)}
.linkbtn{border:0;background:none;color:var(--brand);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
.legal{width:min(760px,100%)}.legal h3{margin-top:10px}.legal p,.legal li{color:var(--ink-soft);line-height:1.6}
@media (max-width:860px){.landing{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.pitch-h{font-size:28px}.pitch-list li{font-size:14px}.authcard{order:-1}}
@media (max-width:860px){.pitch{gap:12px}}
.bigcode{font-size:28px!important;letter-spacing:.25em;text-align:center;text-transform:uppercase;padding:14px!important;font-weight:700}
.btn.big{padding:14px;font-size:17px}
.codeshow{font-family:var(--f-display);font-size:40px;font-weight:700;letter-spacing:.12em;text-align:center;padding:16px;border-radius:var(--r);background:var(--brand-soft);color:var(--brand);user-select:all;direction:ltr}
.newacad{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;color:var(--ink-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mobile-brand{display:none;font-size:18px}.mobile-brand b{color:var(--logo-bright)}
@media (max-width:860px){.mobile-brand{display:inline}.pitch .row:first-child{display:none}}
.codebox{direction:ltr;font-size:18px;font-weight:700;letter-spacing:.18em;padding:4px 10px;border-radius:8px;background:var(--surface-2);user-select:all}
.iconbtn.menubtn{display:none}
.view{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
.scrim{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(280px,86vw);z-index:30;transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
  [dir="rtl"] .side{inset:0 0 0 auto;transform:translateX(102%);padding-left:12px;padding-right:max(12px,env(safe-area-inset-right,0px))}
  .side.open,[dir="rtl"] .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .iconbtn.menubtn{display:inline-flex}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top h1{font-size:19px}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card>h2,.card>.hd{margin-bottom:12px}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd h2,.hd h3{margin-right:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--ink-soft)}
.muted{color:var(--ink-soft)} .faint{color:var(--ink-faint)} .small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.clickable{cursor:pointer;border-radius:var(--r-sm)} .clickable:hover{background:var(--surface-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:8px 14px;font-weight:600;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-soft);min-width:0}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px;font-weight:400;color:var(--ink);min-width:0}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand-2) 55%,transparent);border-color:var(--brand-2)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink)}
.check input{margin-top:3px;accent-color:var(--brand)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.form .full{grid-column:1/-1}
.formactions{display:flex;gap:8px;justify-content:flex-end;grid-column:1/-1;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.brand{background:var(--brand-soft);color:var(--brand)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--brand-2);color:#05301f;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--brand-soft);color:var(--brand)}
.av.sm{width:28px;height:28px;font-size:11.5px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}

.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);text-align:start;font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.clickable td:first-child{font-weight:600}
td.r,th.r{text-align:end}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 12px;color:var(--ink-soft)}
.empty svg{width:36px;height:36px;color:var(--brand-2)}
.empty b{color:var(--ink)}
.notice{border-radius:var(--r-sm);padding:10px 12px;background:var(--info-soft);color:var(--info);font-size:13px}
.notice svg{width:18px;height:18px;flex:none}
.notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.bad{background:var(--bad-soft);color:var(--bad)} .notice.good{background:var(--good-soft);color:var(--good)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dh{background:var(--surface-2);padding:6px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);text-align:center}
.cal .d{background:var(--surface);min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer}
.cal .d.out{background:var(--surface-2);color:var(--ink-faint)}
.cal .d.today .dn{background:var(--brand);color:var(--on-brand);border-radius:999px;padding:0 7px}
.cal .d.sel{outline:2px solid var(--brand-2);outline-offset:-2px}
.dn{font-size:12px;font-weight:700;align-self:flex-start}
.ev{font-size:11.5px;border-radius:5px;padding:2px 5px;background:var(--brand-soft);color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:start;cursor:pointer}
.ev.done{background:var(--good-soft);color:var(--good)}
.more{font-size:11px;color:var(--ink-soft)}
@media (max-width:640px){.cal .d{min-height:58px;padding:4px}.cal .ev{font-size:0;height:6px;padding:0}.cal .dh{font-size:10px;padding:4px 2px}}

.sess{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.sess .time{font-family:var(--f-display);font-weight:700;font-size:18px;min-width:52px;font-variant-numeric:tabular-nums}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-top:1px dashed var(--line)}
.ex:first-child{border-top:0}

.thread{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--surface-2);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
[dir="rtl"] th,[dir="rtl"] .stat .k,[dir="rtl"] .navlabel{letter-spacing:0}
.msg.mine{align-self:flex-end;background:var(--brand);color:var(--on-brand)}
.msg .by{font-size:11.5px;font-weight:600;opacity:.8;margin-bottom:2px}
.msg .at{font-size:10.5px;opacity:.7;margin-top:2px}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.composer textarea{min-height:44px;height:44px}
.chatgrid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.chatgrid{grid-template-columns:minmax(0,1fr)}}

.meal{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal .ph svg{width:28px;height:28px}
.meal img,.meal .ph{width:96px;height:96px;object-fit:cover;border-radius:var(--r-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
.macros{display:flex;gap:6px;flex-wrap:wrap}
.preview img{max-height:180px;border-radius:var(--r-sm)}

.bar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand-2)}
svg.chart text{fill:var(--ink-soft);font-size:11px;font-family:var(--f-body)}
svg.chart .grid{stroke:var(--line)}
svg.chart .ln{stroke:var(--brand);fill:none;stroke-width:2.2}
svg.chart .ar{fill:color-mix(in srgb,var(--brand-2) 18%,transparent)}
svg.chart .pt{fill:var(--brand)}
svg.chart .bx{fill:var(--brand-2)}
svg.chart .bx.hi{fill:var(--warn)}

.modal{position:fixed;inset:0;z-index:40;background:rgba(5,20,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:min(640px,100%);padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}

.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.gate .card{width:min(560px,100%);padding:28px;display:flex;flex-direction:column;gap:14px}
.gate .logo{width:56px;height:56px}
.ai{white-space:pre-wrap;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--brand-2)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0;overflow-wrap:anywhere}
.privacy td:first-child{font-weight:600}
.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<div id="app"><div class="gate"><div class="card"><div class="row"><span class="spinner"></span><b>Opening Performance360 Academy…</b></div><p class="muted">Connecting to your academy's secure data store.</p></div></div></div>
<div id="toast" class="toast" hidden></div>
