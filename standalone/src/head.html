<title>Performance360 Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
/* iOS look: grouped backgrounds, inset grouped cards, large titles, translucent bars, the logo green as tint color. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#f2f2f7; --surface-3:#e5e5ea; --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.2);
  --line:rgba(60,60,67,.18); --ink:#000000; --ink-soft:rgba(60,60,67,.62); --ink-faint:rgba(60,60,67,.36);
  --brand:#1f8a45; --brand-hover:#187339; --brand-2:#34c759; --brand-soft:rgba(52,199,89,.14); --on-brand:#ffffff;
  --logo-deep:#0b5a3a; --logo-bright:#3fae4f;
  --good:#248a3d; --good-soft:rgba(52,199,89,.14); --warn:#c93400; --warn-soft:rgba(255,149,0,.15); --bad:#d70015; --bad-soft:rgba(255,59,48,.12); --info:#0066cc; --info-soft:rgba(0,122,255,.12);
  --bar:rgba(249,249,249,.82); --shadow:0 0 0 rgba(0,0,0,0); --sheet-shadow:0 10px 40px rgba(0,0,0,.18);
  --ss-red:#ff3b30; --ss-orange:#ff9500; --ss-yellow:#ffcc00; --ss-green:#34c759; --ss-teal:#30b0c7; --ss-blue:#007aff; --ss-purple:#af52de; --ss-pink:#ff2d55;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Heebo","Segoe UI",Roboto,system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Heebo","Segoe UI",Roboto,system-ui,sans-serif;
  --r:12px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --surface-3:#3a3a3c; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.32);
  --line:rgba(84,84,88,.6); --ink:#ffffff; --ink-soft:rgba(235,235,245,.6); --ink-faint:rgba(235,235,245,.3);
  --brand:#30d158; --brand-hover:#4cd964; --brand-2:#30d158; --brand-soft:rgba(48,209,88,.18); --on-brand:#00210b;
  --logo-deep:#7fd9a8; --logo-bright:#4cc463;
  --good:#30d158; --good-soft:rgba(48,209,88,.18); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.18); --bad:#ff453a; --bad-soft:rgba(255,69,58,.18); --info:#0a84ff; --info-soft:rgba(10,132,255,.2);
  --bar:rgba(22,22,24,.78); --sheet-shadow:0 10px 40px rgba(0,0,0,.6);
  --ss-red:#ff453a; --ss-orange:#ff9f0a; --ss-yellow:#ffd60a; --ss-green:#30d158; --ss-teal:#40c8e0; --ss-blue:#0a84ff; --ss-purple:#bf5af2; --ss-pink:#ff375f;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --surface-3:#3a3a3c; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.32);
  --line:rgba(84,84,88,.6); --ink:#ffffff; --ink-soft:rgba(235,235,245,.6); --ink-faint:rgba(235,235,245,.3);
  --brand:#30d158; --brand-hover:#4cd964; --brand-2:#30d158; --brand-soft:rgba(48,209,88,.18); --on-brand:#00210b;
  --logo-deep:#7fd9a8; --logo-bright:#4cc463;
  --good:#30d158; --good-soft:rgba(48,209,88,.18); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.18); --bad:#ff453a; --bad-soft:rgba(255,69,58,.18); --info:#0a84ff; --info-soft:rgba(10,132,255,.2);
  --bar:rgba(22,22,24,.78); --sheet-shadow:0 10px 40px rgba(0,0,0,.6);
  --ss-red:#ff453a; --ss-orange:#ff9f0a; --ss-yellow:#ffd60a; --ss-green:#30d158; --ss-teal:#40c8e0; --ss-blue:#0a84ff; --ss-purple:#bf5af2; --ss-pink:#ff375f;
  color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.01em}
h1{font-size:34px;font-weight:700} h2{font-size:20px;font-weight:700} h3{font-size:17px;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell: iPad-style sidebar + large-title content; phone: tab bar ---------- */
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%}
.side{background:var(--bg);border-inline-end:.5px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-weight:700;font-size:17px;line-height:1.1}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--ink-soft)}
.brand b{color:var(--logo-bright)}
.logo{width:34px;height:34px;flex:none}
.navlabel{font-size:13px;color:var(--ink-soft);padding:14px 12px 4px;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;border:0;background:none;text-align:start;cursor:pointer;color:var(--ink);font-size:16px;width:100%}
.nav svg{width:22px;height:22px;flex:none;color:var(--brand)}
.nav:hover{background:var(--fill)}
.nav[aria-current="page"]{background:var(--brand);color:var(--on-brand)}
.nav[aria-current="page"] svg{color:var(--on-brand)}
.nav .badge{margin-inline-start:auto}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;background:var(--surface);border-radius:var(--r)}
.me .who{min-width:0}.me .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);display:flex;align-items:flex-end;gap:12px;padding-block:14px 12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top h1{font-size:30px}
.top .sub{color:var(--ink-soft);font-size:15px;margin-top:2px}
.top .actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.langbtn{font-weight:700;font-size:14px}
.tools{display:inline-flex;gap:6px;flex:none}
.iconbtn.menubtn{display:none}
.view{padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.scrim{display:none}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
  [dir="rtl"] .side{inset:0 0 0 auto;transform:translateX(102%);padding-left:12px;padding-right:max(12px,env(safe-area-inset-right,0px))}
  .side.open,[dir="rtl"] .side.open{transform:none;box-shadow:var(--sheet-shadow)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:25}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
  .top h1{font-size:28px}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;inset:auto 0 0 0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--ink-faint);font-size:10.5px;font-weight:500;cursor:pointer;padding:4px 0;position:relative}
  .tabbar button svg{width:26px;height:26px}
  .tabbar button[aria-current="page"]{color:var(--brand)}
  .tabbar .badge{position:absolute;top:0;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;font-size:11px}
}

/* ---------- inset grouped cards and lists ---------- */
.card{background:var(--surface);border-radius:var(--r);padding:16px;min-width:0}
.card>h2,.card>.hd{margin-bottom:12px}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd h2,.hd h3{margin-inline-end:auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.g4{gap:10px}}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:13px;color:var(--ink-soft);font-weight:600}
.stat .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .s{font-size:13px;color:var(--ink-soft)}
.muted{color:var(--ink-soft)} .faint{color:var(--ink-faint)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:.5px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.clickable{cursor:pointer;border-radius:var(--r-sm)} .clickable:hover{background:var(--fill)}

/* ---------- buttons, controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--fill);color:var(--brand);border-radius:var(--r-sm);padding:9px 16px;font-weight:600;font-size:15px;cursor:pointer;line-height:1.2;white-space:nowrap;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97);opacity:.8}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--bad);background:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.iconbtn{border:0;background:var(--fill);border-radius:50%;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand);flex:none}
.iconbtn svg{width:19px;height:19px}

label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--ink-soft);min-width:0}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{width:100%;border:0;background:var(--fill);border-radius:var(--r-sm);padding:10px 12px;font-size:16px;color:var(--ink);min-width:0;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:30px}
[dir="rtl"] select{background-position:16px 55%,11px 55%}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0}
.check{display:flex;gap:12px;align-items:center;font-size:15px;color:var(--ink);line-height:1.35}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:51px;height:31px;border-radius:16px;background:var(--fill-2);position:relative;cursor:pointer;transition:background .2s;margin:0}
.check input::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.check input:checked{background:var(--brand-2)}
.check input:checked::after{transform:translateX(20px)}
[dir="rtl"] .check input:checked::after{transform:translateX(-20px)}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.form .full{grid-column:1/-1}
.formactions{display:flex;gap:8px;justify-content:flex-end;grid-column:1/-1;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--fill);color:var(--ink-soft);white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.brand{background:var(--brand-soft);color:var(--brand)}
.badge{min-width:20px;height:20px;border-radius:10px;background:#ff3b30;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.nav[aria-current="page"] .badge{background:#fff;color:var(--brand)}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;background:linear-gradient(180deg,#a5aab3,#868b94);color:#fff}
.av.sm{width:30px;height:30px;font-size:12px}

.tabs,.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:0;max-width:100%;overflow-x:auto;scrollbar-width:none;align-self:flex-start}
.tab,.seg button{border:0;background:none;padding:6px 14px;font-weight:500;font-size:14px;color:var(--ink);cursor:pointer;border-radius:7px;white-space:nowrap}
.tab[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
[data-theme="dark"] .tab[aria-selected="true"],[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"],:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:13px;color:var(--ink-soft);text-align:start;font-weight:500;padding:8px;border-bottom:.5px solid var(--line);white-space:nowrap}
td{padding:11px 8px;border-bottom:.5px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clickable td:first-child{font-weight:600}
td.r,th.r{text-align:end}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 12px;color:var(--ink-soft)}
.empty svg{width:44px;height:44px;color:var(--ink-faint)}
.empty b{color:var(--ink);font-size:17px}
.notice{border-radius:var(--r-sm);padding:11px 14px;background:var(--info-soft);color:var(--info);font-size:14px}
.notice svg{width:18px;height:18px;flex:none}
.notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.bad{background:var(--bad-soft);color:var(--bad)} .notice.good{background:var(--good-soft);color:var(--good)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-radius:var(--r);overflow:hidden;background:var(--line);gap:.5px}
.cal .dh{background:var(--surface);padding:6px;font-size:12px;font-weight:600;color:var(--ink-soft);text-align:center}
.cal .d{background:var(--surface);min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer}
.cal .d.out{color:var(--ink-faint)}
.cal .d.today .dn{background:#ff3b30;color:#fff;border-radius:999px;padding:0 7px}
.cal .d.sel{background:var(--fill)}
.dn{font-size:14px;font-weight:600;align-self:flex-start}
.ev{font-size:12px;border-radius:5px;padding:2px 6px;background:var(--brand-soft);color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:start;cursor:pointer;font-weight:500}
.ev.done{background:var(--good-soft);color:var(--good)}
.more{font-size:11px;color:var(--ink-soft)}
@media (max-width:640px){.cal .d{min-height:48px;padding:4px;align-items:center}.cal .ev{font-size:0;width:6px;height:6px;padding:0;border-radius:50%;background:var(--brand)}.cal .ev.done{background:var(--good)}.cal .dh{font-size:11px;padding:4px 2px}}

.sess{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-sm);background:var(--surface-2)}
.sess .time{font-weight:700;font-size:17px;min-width:52px;font-variant-numeric:tabular-nums}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:.5px solid var(--line)}
.ex:first-child{border-top:0}

.thread{display:flex;flex-direction:column;gap:6px;max-height:56vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:78%;padding:8px 13px;border-radius:18px;background:var(--surface-3);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.msg.mine{align-self:flex-end;background:var(--brand);color:var(--on-brand)}
.msg .by{font-size:12px;font-weight:600;opacity:.75;margin-bottom:2px}
.msg .at{font-size:11px;opacity:.65;margin-top:2px}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.composer textarea{min-height:40px;height:40px;border-radius:20px;padding:9px 14px}
.chatgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.chatgrid{grid-template-columns:minmax(0,1fr)}}

.meal{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px 0;border-top:.5px solid var(--line)}
.meal:first-child{border-top:0}
.meal img,.meal .ph{width:96px;height:96px;object-fit:cover;border-radius:var(--r-sm);background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
.meal .ph svg{width:28px;height:28px}
.macros{display:flex;gap:6px;flex-wrap:wrap}
.preview img{max-height:180px;border-radius:var(--r-sm)}

.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand-2)}
svg.chart text{fill:var(--ink-soft);font-size:11px;font-family:var(--f-body)}
svg.chart .grid{stroke:var(--line)}
svg.chart .ln{stroke:var(--brand);fill:none;stroke-width:2.4}
svg.chart .ar{fill:color-mix(in srgb,var(--brand-2) 16%,transparent)}
svg.chart .pt{fill:var(--brand)}
svg.chart .bx{fill:var(--brand-2)}
svg.chart .bx.hi{fill:var(--warn)}

/* sheets: centered on large screens, slide up from the bottom on phones */
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;animation:fade .2s}
.modal .box{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 48px);overflow-y:auto;padding:20px;box-shadow:var(--sheet-shadow);display:flex;flex-direction:column;gap:14px;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@media (max-width:640px){.modal{align-items:flex-end;padding:0}.modal .box{width:100%;border-radius:14px 14px 0 0;max-height:92vh;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px))}.modal .box::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--fill-2);align-self:center;flex:none}}
@keyframes fade{from{opacity:0}} @keyframes rise{from{transform:translateY(24px);opacity:.6}}
