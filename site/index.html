\u05E8\u05D4 \u05D5\u05E1\u05E4\u05E8\u05D9\u05E0\u05D8, \u05D5\u05D9\u05D7\u05E1 \u05D4\u05E2\u05D5\u05DE\u05E1. \u05DE\u05E1\u05DB\u05DE\u05D9\u05DD \u05E2\u05DD \u05D4\u05E6\u05D5\u05D5\u05EA \u05E0\u05E7\u05D5\u05D3\u05D5\u05EA \u05D4\u05E4\u05E2\u05DC\u05D4 \u05DC\u05E4\u05E0\u05D9 \u05EA\u05D7\u05D9\u05DC\u05EA \u05D4\u05E8\u05E6\u05E3.","- \u05E8\u05D5\u05E9\u05DE\u05D9\u05DD \u05D0\u05EA \u05D4\u05E0\u05D9\u05DE\u05D5\u05E7\u05D9\u05DD \u05DB\u05D3\u05D9 \u05E9\u05D4\u05D4\u05D7\u05DC\u05D8\u05D4 \u05EA\u05D4\u05D9\u05D4 \u05DE\u05E9\u05D5\u05EA\u05E4\u05EA \u05DC\u05E6\u05D5\u05D5\u05EA \u05D4\u05D0\u05D9\u05DE\u05D5\u05DF, \u05D4\u05E8\u05E4\u05D5\u05D0\u05D9 \u05D5\u05D4\u05DE\u05E7\u05E6\u05D5\u05E2\u05D9.","\u05E8\u05D5\u05D5\u05D7\u05D9\u05DD \u05DC\u05D8\u05D5\u05D5\u05D7 \u05E7\u05E6\u05E8 \u05DE\u05E9\u05D9\u05DE\u05D5\u05E9 \u05D9\u05EA\u05E8 \u05D1\u05DB\u05DE\u05D4 \u05E9\u05D7\u05E7\u05E0\u05D9\u05DD \u05E0\u05D5\u05D8\u05D9\u05DD \u05DC\u05D4\u05D9\u05E4\u05E8\u05E2 \u05D1\u05D4\u05DE\u05E9\u05DA \u05D1\u05D6\u05DE\u05D9\u05E0\u05D5\u05EA."]}},{id:"rotation-returning",roles:["head_coach","director","head_of_performance","team_staff"],en:{title:"Rotation when players are returning from injury",keys:["rotation","rotate","returning from injury","several players","bring back","minutes for","squad rotation"],body:["Return players in **steps agreed with the medical staff,** not by date:","- Build match exposure gradually (a short cameo, then a start with a planned substitution) and confirm with the clinician that criteria were met first.","- Pair returning players with fit teammates in the same role so you are never forced to overplay one.","- Check the **next-day response:** soreness, wellness and GPS load. A poor response means hold the step.","- Keep the athlete informed and involved; surprise changes in minutes damage trust and are risky.","- Clearance is recorded in **Injuries** by authorised staff with a written basis; selection remains the coach's decision."]},he:{title:"\u05E8\u05D5\u05D8\u05E6\u05D9\u05D4 \u05DB\u05E9\u05E9\u05D7\u05E7\u05E0\u05D9\u05DD \u05D7\u05D5\u05D6\u05E8\u05D9\u05DD \u05DE\u05E4\u05E6\u05D9\u05E2\u05D4",keys:["\u05E8\u05D5\u05D8\u05E6\u05D9\u05D4","\u05D7\u05D5\u05D6\u05E8\u05D9\u05DD \u05DE\u05E4\u05E6\u05D9\u05E2\u05D4","\u05DB\u05DE\u05D4 \u05E9\u05D7\u05E7\u05E0\u05D9\u05DD","\u05DC\u05D4\u05D7\u05D6\u05D9\u05E8 \u05E9\u05D7\u05E7\u05E0\u05D9\u05DD","\u05D3\u05E7\u05D5\u05EA \u05DE\u05E9\u05D7\u05E7","\u05E8\u05D5\u05D8\u05E6\u05D9\u05D9\u05EA \u05E1\u05D2\u05DC"],body:["\u05DE\u05D7\u05D6\u05D9\u05E8\u05D9\u05DD \u05E9\u05D7\u05E7\u05E0\u05D9\u05DD \u05D1**\u05E6\u05E2\u05D3\u05D9\u05DD \u05E9\u05DE\u05D5\u05E1\u05DB\u05DE\u05D9\u05DD \u05E2\u05DD \u05D4\u05E6\u05D5\u05D5\u05EA \u05D4\u05E8\u05E4\u05D5\u05D0\u05D9,** \u05DC\u05D0 \u05DC\u05E4\u05D9 \u05EA\u05D0\u05E8\u05D9\u05DA:","- \u05D1\u05D5\u05E0\u05D9\u05DD \u05D7\u05E9\u05D9\u05E4\u05D4 \u05DC\u05DE\u05E9\u05D7\u05E7 \u05D1\u05D4\u05D3\u05E8\u05D2\u05D4 (\u05DB\u05E0\u05D9\u05E1\u05D4 \u05E7\u05E6\u05E8\u05D4, \u05D0\u05D7\u05E8 \u05DB\u05DA \u05D4\u05E8\u05DB\u05D1 \u05E2\u05DD \u05D4\u05D7\u05DC\u05E4\u05D4 \u05DE\u05EA\u05D5\u05DB\u05E0\u05E0\u05EA) \u05D5\u05DE\u05D5\u05D5\u05D3\u05D0\u05D9\u05DD \u05DE\u05D5\u05DC \u05D4\u05E7\u05DC\u05D9\u05E0\u05D0\u05D9 \u05E9\u05D4\u05E7\u05E8\u05D9\u05D8\u05E8\u05D9\u05D5\u05E0\u05D9\u05DD \u05D4\u05EA\u05E7\u05D9\u05D9\u05DE\u05D5 \u05E7\u05D5\u05D3\u05DD.","- \u05DE\u05E9\u05DC\u05D1\u05D9\u05DD \u05E9\u05D7\u05E7\u05E0\u05D9\u05DD \u05D7\u05D5\u05D6\u05E8\u05D9\u05DD \u05E2\u05DD \u05D7\u05D1\u05E8\u05D9\u05DD \u05DB\u05E9\u05D9\u05E8\u05D9\u05DD \u05D1\u05D0\u05D5\u05EA\u05D5 \u05EA\u05E4\u05E7\u05D9\u05D3 \u05DB\u05D3\u05D9 \u05E9\u05DC\u05D0 \u05EA\u05D0\u05D5\u05DC\u05E6\u05D5 \u05DC\u05E9\u05D7\u05E7 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D3\u05D9 \u05E9\u05D7\u05E7\u05DF \u05D0\u05D7\u05D3.","- \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D0\u05EA **\u05D4\u05EA\u05D2\u05D5\u05D1\u05D4 \u05DC\u05DE\u05D7\u05E8\u05EA:** \u05DB\u05D0\u05D1\u05D9 \u05E9\u05E8\u05D9\u05E8\u05D9\u05DD, \u05E8\u05D5\u05D5\u05D7\u05D4 \u05D5\u05E2\u05D5\u05DE\u05E1 GPS. \u05EA\u05D2\u05D5\u05D1\u05D4 \u05D2\u05E8\u05D5\u05E2\u05D4 \u05E4\u05D9\u05E8\u05D5\u05E9\u05D4 \u05DC\u05E2\u05E6\u05D5\u05E8 \u05D1\u05E6\u05E2\u05D3 \u05D4\u05E0\u05D5\u05DB\u05D7\u05D9.","- \u05DE\u05E2\u05D3\u05DB\u05E0\u05D9\u05DD \u05D0\u05EA \u05D4\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9 \u05D5\u05DE\u05E2\u05E8\u05D1\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5; \u05E9\u05D9\u05E0\u05D5\u05D9\u05D9 \u05D3\u05E7\u05D5\u05EA \u05DE\u05E4\u05EA\u05D9\u05E2\u05D9\u05DD \u05E4\u05D5\u05D2\u05E2\u05D9\u05DD \u05D1\u05D0\u05DE\u05D5\u05DF \u05D5\u05DE\u05E1\u05D5\u05DB\u05E0\u05D9\u05DD.","- \u05D0\u05D9\u05E9\u05D5\u05E8 \u05D7\u05D6\u05E8\u05D4 \u05E0\u05E8\u05E9\u05DD \u05D1**\u05E4\u05E6\u05D9\u05E2\u05D5\u05EA** \u05E2\u05DC \u05D9\u05D3\u05D9 \u05E6\u05D5\u05D5\u05EA \u05DE\u05D5\u05E8\u05E9\u05D4 \u05E2\u05DD \u05E0\u05D9\u05DE\u05D5\u05E7 \u05DB\u05EA\u05D5\u05D1; \u05D4\u05D1\u05D7\u05D9\u05E8\u05D4 \u05D1\u05D4\u05E8\u05DB\u05D1 \u05E0\u05E9\u05D0\u05E8\u05EA \u05D4\u05D7\u05DC\u05D8\u05EA \u05D4\u05DE\u05D0\u05DE\u05DF."]}},{id:"confidence-feedback",roles:["head_coach","personal_trainer","team_staff","head_of_performance"],en:{title:"Giving feedback to a young player losing confidence",keys:["feedback","confidence","losing confidence","young player","motivation","motivate","demotivated","mistakes"],body:["- **Talk privately,** early and calmly, not straight after a mistake or in front of the group.","- **Be specific and about behaviour:** name one thing done well and one thing to work on, not the person.","- **Ask first:** how does the player see it? Often they already know, and ownership beats instruction.","- **Set small, controllable goals** (process, not outcome) and notice progress out loud.","- Keep your tone and expectations steady; confidence grows in a predictable environment.","- If the drop is large, lasting or comes with sleep, mood or appetite changes, involve the club's welfare or a qualified professional."]},he:{title:"\u05DE\u05E9\u05D5\u05D1 \u05DC\u05E9\u05D7\u05E7\u05DF \u05E6\u05E2\u05D9\u05E8 \u05E9\u05DE\u05D0\u05D1\u05D3 \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF",keys:["\u05DE\u05E9\u05D5\u05D1","\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF","\u05DE\u05D0\u05D1\u05D3 \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF","\u05E9\u05D7\u05E7\u05DF \u05E6\u05E2\u05D9\u05E8","\u05DE\u05D5\u05D8\u05D9\u05D1\u05E6\u05D9\u05D4","\u05DC\u05EA\u05EA \u05DE\u05D5\u05D8\u05D9\u05D1\u05E6\u05D9\u05D4","\u05D8\u05E2\u05D5\u05D9\u05D5\u05EA"],body:["- **\u05DE\u05D3\u05D1\u05E8\u05D9\u05DD \u05D1\u05E4\u05E8\u05D8\u05D9\u05D5\u05EA,** \u05DE\u05D5\u05E7\u05D3\u05DD \u05D5\u05D1\u05E0\u05D7\u05EA, \u05DC\u05D0 \u05DE\u05D9\u05D3 \u05D0\u05D7\u05E8\u05D9 \u05D8\u05E2\u05D5\u05EA \u05D5\u05DC\u05D0 \u05DE\u05D5\u05DC \u05D4\u05E7\u05D1\u05D5\u05E6\u05D4.","- **\u05E1\u05E4\u05E6\u05D9\u05E4\u05D9\u05D9\u05DD \u05D5\u05D1\u05E0\u05D5\u05E9\u05D0 \u05D4\u05EA\u05E0\u05D4\u05D2\u05D5\u05EA:** \u05DE\u05E6\u05D9\u05D9\u05E0\u05D9\u05DD \u05D3\u05D1\u05E8 \u05D0\u05D7\u05D3 \u05E9\u05E0\u05E2\u05E9\u05D4 \u05D8\u05D5\u05D1 \u05D5\u05D3\u05D1\u05E8 \u05D0\u05D7\u05D3 \u05DC\u05E2\u05D1\u05D5\u05D3 \u05E2\u05DC\u05D9\u05D5, \u05DC\u05D0 \u05D0\u05EA \u05D4\u05D0\u05D3\u05DD.","- **\u05E9\u05D5\u05D0\u05DC\u05D9\u05DD \u05E7\u05D5\u05D3\u05DD:** \u05D0\u05D9\u05DA \u05D4\u05E9\u05D7\u05E7\u05DF \u05E8\u05D5\u05D0\u05D4 \u05D0\u05EA \u05D6\u05D4? \u05DC\u05E2\u05D9\u05EA\u05D9\u05DD \u05E7\u05E8\u05D5\u05D1\u05D5\u05EA \u05D4\u05D5\u05D0 \u05DB\u05D1\u05E8 \u05D9\u05D5\u05D3\u05E2, \u05D5\u05D0\u05D7\u05E8\u05D9\u05D5\u05EA \u05E2\u05D3\u05D9\u05E4\u05D4 \u05E2\u05DC \u05D4\u05D5\u05E8\u05D0\u05D4.","- **\u05DE\u05D2\u05D3\u05D9\u05E8\u05D9\u05DD \u05DE\u05D8\u05E8\u05D5\u05EA \u05E7\u05D8\u05E0\u05D5\u05EA \u05D4\u05E0\u05D9\u05EA\u05E0\u05D5\u05EA \u05DC\u05E9\u05DC\u05D9\u05D8\u05D4** (\u05EA\u05D4\u05DC\u05D9\u05DA \u05D5\u05DC\u05D0 \u05EA\u05D5\u05E6\u05D0\u05D4) \u05D5\u05DE\u05E6\u05D9\u05D9\u05E0\u05D9\u05DD \u05D4\u05EA\u05E7\u05D3\u05DE\u05D5\u05EA \u05D1\u05E7\u05D5\u05DC.","- \u05E9\u05D5\u05DE\u05E8\u05D9\u05DD \u05E2\u05DC \u05D8\u05D5\u05DF \u05D5\u05E6\u05D9\u05E4\u05D9\u05D5\u05EA \u05D9\u05E6\u05D9\u05D1\u05D9\u05DD; \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05D2\u05D3\u05DC \u05D1\u05E1\u05D1\u05D9\u05D1\u05D4 \u05E6\u05E4\u05D5\u05D9\u05D4.","- \u05D0\u05DD \u05D4\u05D9\u05E8\u05D9\u05D3\u05D4 \u05D2\u05D3\u05D5\u05DC\u05D4, \u05DE\u05DE\u05D5\u05E9\u05DB\u05EA \u05D0\u05D5 \u05DE\u05DC\u05D5\u05D5\u05D4 \u05D1\u05E9\u05D9\u05E0\u05D5\u05D9\u05D9 \u05E9\u05D9\u05E0\u05D4, \u05DE\u05E6\u05D1 \u05E8\u05D5\u05D7 \u05D0\u05D5 \u05EA\u05D9\u05D0\u05D1\u05D5\u05DF, \u05DE\u05E2\u05E8\u05D1\u05D9\u05DD \u05D0\u05EA \u05D2\u05D5\u05E8\u05DD \u05D4\u05E8\u05D5\u05D5\u05D7\u05D4 \u05D1\u05DE\u05D5\u05E2\u05D3\u05D5\u05DF \u05D0\u05D5 \u05D0\u05D9\u05E9 \u05DE\u05E7\u05E6\u05D5\u05E2 \u05DE\u05D5\u05E1\u05DE\u05DA."]}},{id:"staff-structure",roles:["director"],en:{title:"Structuring coaching, medical and performance staff",keys:["structure the","staff structure","shared decisions","decisions are shared","medical and coaching","performance, medical","organise staff","organize staff","roles and responsibilities","performance department"],body:["Make decision rights explicit so nobody is pressured and nobody is bypassed:","- **Medical staff** own diagnosis, treatment and clearance. **Coaches** own selection and tactics. **Performance staff** own load planning and monitoring, and advise on the rest.","- Hold a **short weekly meeting** with coaching, medical and performance leads (and the analyst): availability, load, upcoming fixtures, decisions needed.","- Use **one shared source of truth** (this app) so everyone sees the same injuries, load and wellness.","- Agree an **escalation path** for disagreements (for example the director decides after hearing both sides) and record the reasoning.","- Protect clinicians from pressure to clear players early; clearance here requires a written basis from authorised staff.","Invite staff and set their roles in **My Team**; the director's view is read-only on athletes and injuries by design."]},he:{title:"\u05DE\u05D1\u05E0\u05D4 \u05E6\u05D5\u05D5\u05EA \u05D0\u05D9\u05DE\u05D5\u05DF, \u05E8\u05E4\u05D5\u05D0\u05D9 \u05D5\u05DE\u05E7\u05E6\u05D5\u05E2\u05D9",keys:["\u05DC\u05D1\u05E0\u05D5\u05EA \u05D0\u05EA \u05E9\u05D9\u05EA\u05D5\u05E3","\u05E9\u05D9\u05EA\u05D5\u05E3 \u05D4\u05E4\u05E2\u05D5\u05DC\u05D4","\u05D4\u05D7\u05DC\u05D8\u05D5\u05EA \u05DE\u05EA\u05E7\u05D1\u05DC\u05D5\u05EA \u05D9\u05D7\u05D3","\u05DE\u05D1\u05E0\u05D4 \u05E6\u05D5\u05D5\u05EA","\u05E6\u05D5\u05D5\u05EA \u05E8\u05E4\u05D5\u05D0\u05D9","\u05EA\u05E4\u05E7\u05D9\u05D3\u05D9\u05DD \u05D5\u05D0\u05D7\u05E8\u05D9\u05D5\u05EA","\u05DE\u05D7\u05DC\u05E7\u05EA \u05D1\u05D9\u05E6\u05D5\u05E2\u05D9\u05DD","\u05DC\u05D0\u05E8\u05D2\u05DF \u05E6\u05D5\u05D5\u05EA"],body:["\u05DE\u05D2\u05D3\u05D9\u05E8\u05D9\u05DD \u05D1\u05DE\u05E4\u05D5\u05E8\u05E9 \u05D6\u05DB\u05D5\u05D9\u05D5\u05EA \u05D4\u05D7\u05DC\u05D8\u05D4 \u05DB\u05D3\u05D9 \u05E9\u05D0\u05E3 \u05D0\u05D7\u05D3 \u05DC\u05D0 \u05D9\u05D4\u05D9\u05D4 \u05EA\u05D7\u05EA \u05DC\u05D7\u05E5 \u05D5\u05D0\u05E3 \u05D0\u05D7\u05D3 \u05DC\u05D0 \u05D9\u05E2\u05E7\u05E3:","- **\u05D4\u05E6\u05D5\u05D5\u05EA \u05D4\u05E8\u05E4\u05D5\u05D0\u05D9** \u05D0\u05D7\u05E8\u05D0\u05D9 \u05DC\u05D0\u05D1\u05D7\u05D5\u05DF, \u05D8\u05D9\u05E4\u05D5\u05DC \u05D5\u05D0\u05D9\u05E9\u05D5\u05E8 \u05D7\u05D6\u05E8\u05D4. **\u05D4\u05DE\u05D0\u05DE\u05E0\u05D9\u05DD** \u05D0\u05D7\u05E8\u05D0\u05D9\u05DD \u05DC\u05D1\u05D7\u05D9\u05E8\u05EA \u05D4\u05E8\u05DB\u05D1 \u05D5\u05D8\u05E7\u05D8\u05D9\u05E7\u05D4. **\u05E6\u05D5\u05D5\u05EA \u05D4\u05D1\u05D9\u05E6\u05D5\u05E2\u05D9\u05DD** \u05D0\u05D7\u05E8\u05D0\u05D9 \u05DC\u05EA\u05DB\u05E0\u05D5\u05DF \u05D5\u05E0\u05D9\u05D8\u05D5\u05E8 \u05E2\u05D5\u05DE\u05E1\u05D9\u05DD \u05D5\u05DE\u05D9\u05D9\u05E2\u05E5 \u05D1\u05E9\u05D0\u05E8.","- \u05DE\u05E7\u05D9\u05D9\u05DE\u05D9\u05DD **\u05E4\u05D2\u05D9\u05E9\u05D4 \u05E9\u05D1\u05D5\u05E2\u05D9\u05EA \u05E7\u05E6\u05E8\u05D4** \u05E9\u05DC \u05E8\u05D0\u05E9\u05D9 \u05D4\u05D0\u05D9\u05DE\u05D5\u05DF, \u05D4\u05E8\u05E4\u05D5\u05D0\u05D9 \u05D5\u05D4\u05D1\u05D9\u05E6\u05D5\u05E2\u05D9\u05DD (\u05D5\u05D4\u05D0\u05E0\u05DC\u05D9\u05E1\u05D8): \u05D6\u05DE\u05D9\u05E0\u05D5\u05EA, \u05E2\u05D5\u05DE\u05E1, \u05DE\u05E9\u05D7\u05E7\u05D9\u05DD \u05E7\u05E8\u05D5\u05D1\u05D9\u05DD, \u05D4\u05D7\u05DC\u05D8\u05D5\u05EA \u05E0\u05D3\u05E8\u05E9\u05D5\u05EA.","- \u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1**\u05DE\u05E7\u05D5\u05E8 \u05D0\u05DE\u05EA \u05D0\u05D7\u05D3** (\u05D4\u05D0\u05E4\u05DC\u05D9\u05E7\u05E6\u05D9\u05D4 \u05D4\u05D6\u05D5) \u05DB\u05D3\u05D9 \u05E9\u05DB\u05D5\u05DC\u05DD \u05D9\u05E8\u05D0\u05D5 \u05D0\u05EA \u05D0\u05D5\u05EA\u05DF \u05E4\u05E6\u05D9\u05E2\u05D5\u05EA, \u05E2\u05D5\u05DE\u05E1\u05D9\u05DD \u05D5\u05E8\u05D5\u05D5\u05D7\u05D4.","- \u05DE\u05E1\u05DB\u05DE\u05D9\u05DD **\u05DE\u05E1\u05DC\u05D5\u05DC \u05D4\u05E1\u05DC\u05DE\u05D4** \u05DC\u05DE\u05D7\u05DC\u05D5\u05E7\u05D5\u05EA (\u05DC\u05DE\u05E9\u05DC \u05D4\u05DE\u05E0\u05D4\u05DC \u05DE\u05DB\u05E8\u05D9\u05E2 \u05D0\u05D7\u05E8\u05D9 \u05E9\u05E9\u05DE\u05E2 \u05D0\u05EA \u05E9\u05E0\u05D9 \u05D4\u05E6\u05D3\u05D3\u05D9\u05DD) \u05D5\u05E8\u05D5\u05E9\u05DE\u05D9\u05DD \u05D0\u05EA \u05D4\u05E0\u05D9\u05DE\u05D5\u05E7\u05D9\u05DD.","- \u05DE\u05D2\u05D9\u05E0\u05D9\u05DD \u05E2\u05DC \u05D4\u05E7\u05DC\u05D9\u05E0\u05D0\u05D9\u05DD \u05DE\u05DC\u05D7\u05E5 \u05DC\u05D0\u05E9\u05E8 \u05D7\u05D6\u05E8\u05D4 \u05DE\u05D5\u05E7\u05D3\u05DD; \u05DB\u05D0\u05DF \u05D0\u05D9\u05E9\u05D5\u05E8 \u05D3\u05D5\u05E8\u05E9 \u05E0\u05D9\u05DE\u05D5\u05E7 \u05DB\u05EA\u05D5\u05D1 \u05DE\u05E6\u05D5\u05D5\u05EA \u05DE\u05D5\u05E8\u05E9\u05D4.","\u05DE\u05D6\u05DE\u05D9\u05E0\u05D9\u05DD \u05E6\u05D5\u05D5\u05EA \u05D5\u05E7\u05D5\u05D1\u05E2\u05D9\u05DD \u05EA\u05E4\u05E7\u05D9\u05D3\u05D9\u05DD \u05D1**\u05D4\u05E6\u05D5\u05D5\u05EA \u05E9\u05DC\u05D9**; \u05EA\u05E6\u05D5\u05D2\u05EA \u05D4\u05DE\u05E0\u05D4\u05DC \u05D4\u05D9\u05D0 \u05DC\u05E7\u05E8\u05D9\u05D0\u05D4 \u05D1\u05DC\u05D1\u05D3 \u05E2\u05DC \u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9\u05DD \u05D5\u05E4\u05E6\u05D9\u05E2\u05D5\u05EA, \u05D1\u05DB\u05D5\u05D5\u05E0\u05D4."]}},{id:"kpis",roles:["director","head_of_performance","team_staff","head_coach"],en:{title:"Injury and availability indicators",keys:["indicators","availability","injury rate","injury burden","kpi","kpis","metrics to track","over-reading","each month","monthly report"],body:["Ask for a small, stable set each month:","- **Availability:** share of the squad fully available for training and matches.","- **Injury incidence** per 1000 hours of exposure, split by training and match.","- **Injury burden:** days lost per injury and in total, plus the **recurrence** rate.","- **Load trend** and the share of athletes outside the usual workload ratio range.","Avoid over-reading: squads are small, so one injury moves the numbers a lot; compare with your **own history,** not other clubs; look at 3 to 6 month trends; and never rank staff by injury counts. Pair every number with the context that explains it."]},he:{title:"\u05DE\u05D3\u05D3\u05D9 \u05E4\u05E6\u05D9\u05E2\u05D5\u05EA \u05D5\u05D6\u05DE\u05D9\u05E0\u05D5\u05EA",keys:["\u05DE\u05D3\u05D3\u05D9 \u05E4\u05E6\u05D9\u05E2\u05D5\u05EA","\u05DE\u05D3\u05D3\u05D9\u05DD","\u05D6\u05DE\u05D9\u05E0\u05D5\u05EA","\u05E9\u05D9\u05E2\u05D5\u05E8 \u05E4\u05E6\u05D9\u05E2\u05D5\u05EA","\u05E2\u05D5\u05DE\u05E1 \u05E4\u05E6\u05D9\u05E2\u05D5\u05EA","\u05DB\u05DC \u05D7\u05D5\u05D3\u05E9","\u05DC\u05E7\u05E8\u05D5\u05D0 \u05D0\u05D5\u05EA\u05DD \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D3\u05D9","\u05D3\u05D5\u05D7 \u05D7\u05D5\u05D3\u05E9\u05D9"],body:["\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05E7\u05D1\u05D5\u05E6\u05D4 \u05E7\u05D8\u05E0\u05D4 \u05D5\u05D9\u05E6\u05D9\u05D1\u05D4 \u05E9\u05DC \u05DE\u05D3\u05D3\u05D9\u05DD \u05D1\u05DB\u05DC \u05D7\u05D5\u05D3\u05E9:","- **\u05D6\u05DE\u05D9\u05E0\u05D5\u05EA:** \u05D7\u05DC\u05E7 \u05D4\u05E1\u05D2\u05DC \u05E9\u05DB\u05E9\u05D9\u05E8 \u05D1\u05DE\u05DC\u05D5\u05D0\u05D5 \u05DC\u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD \u05D5\u05DC\u05DE\u05E9\u05D7\u05E7\u05D9\u05DD.","- **\u05E9\u05DB\u05D9\u05D7\u05D5\u05EA \u05E4\u05E6\u05D9\u05E2\u05D5\u05EA** \u05DC-1000 \u05E9\u05E2\u05D5\u05EA \u05D7\u05E9\u05D9\u05E4\u05D4, \u05D1\u05D7\u05DC\u05D5\u05E7\u05D4 \u05DC\u05D0\u05D9\u05DE\u05D5\u05DF \u05D5\u05DE\u05E9\u05D7\u05E7.","- **\u05E0\u05D8\u05DC \u05E4\u05E6\u05D9\u05E2\u05D5\u05EA:** \u05D9\u05DE\u05D9 \u05D4\u05D9\u05E2\u05D3\u05E8\u05D5\u05EA \u05DC\u05E4\u05E6\u05D9\u05E2\u05D4 \u05D5\u05D1\u05E1\u05DA \u05D4\u05DB\u05D5\u05DC, \u05D5\u05E9\u05D9\u05E2\u05D5\u05E8 **\u05D7\u05D6\u05E8\u05EA\u05D9\u05D5\u05EA**.","- **\u05DE\u05D2\u05DE\u05EA \u05E2\u05D5\u05DE\u05E1** \u05D5\u05D7\u05DC\u05E7 \u05D4\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9\u05DD \u05DE\u05D7\u05D5\u05E5 \u05DC\u05D8\u05D5\u05D5\u05D7 \u05D4\u05E8\u05D2\u05D9\u05DC \u05E9\u05DC \u05D9\u05D7\u05E1 \u05D4\u05E2\u05D5\u05DE\u05E1.","\u05DB\u05D3\u05D9 \u05DC\u05D0 \u05DC\u05E7\u05E8\u05D5\u05D0 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D3\u05D9: \u05D4\u05E1\u05D2\u05DC\u05D9\u05DD \u05E7\u05D8\u05E0\u05D9\u05DD \u05D5\u05DC\u05DB\u05DF \u05E4\u05E6\u05D9\u05E2\u05D4 \u05D0\u05D7\u05EA \u05DE\u05D6\u05D9\u05D6\u05D4 \u05D4\u05E8\u05D1\u05D4 \u05D0\u05EA \u05D4\u05DE\u05E1\u05E4\u05E8\u05D9\u05DD; \u05DE\u05E9\u05D5\u05D5\u05D9\u05DD \u05DC**\u05D4\u05D9\u05E1\u05D8\u05D5\u05E8\u05D9\u05D4 \u05E9\u05DC\u05DB\u05DD** \u05D5\u05DC\u05D0 \u05DC\u05DE\u05D5\u05E2\u05D3\u05D5\u05E0\u05D9\u05DD \u05D0\u05D7\u05E8\u05D9\u05DD; \u05DE\u05E1\u05EA\u05DB\u05DC\u05D9\u05DD \u05E2\u05DC \u05DE\u05D2\u05DE\u05D5\u05EA \u05E9\u05DC 3 \u05E2\u05D3 6 \u05D7\u05D5\u05D3\u05E9\u05D9\u05DD; \u05D5\u05DC\u05E2\u05D5\u05DC\u05DD \u05DC\u05D0 \u05DE\u05D3\u05E8\u05D2\u05D9\u05DD \u05D0\u05E0\u05E9\u05D9 \u05E6\u05D5\u05D5\u05EA \u05DC\u05E4\u05D9 \u05DE\u05E1\u05E4\u05E8 \u05E4\u05E6\u05D9\u05E2\u05D5\u05EA. \u05DB\u05DC \u05DE\u05E1\u05E4\u05E8 \u05DE\u05DC\u05D5\u05D5\u05D9\u05DD \u05D1\u05D4\u05E7\u05E9\u05E8 \u05E9\u05DE\u05E1\u05D1\u05D9\u05E8 \u05D0\u05D5\u05EA\u05D5."]}},{id:"reporting",roles:["team_staff","head_of_performance","director","head_coach"],en:{title:"Presenting monitoring data and weekly reports",keys:["present monitoring","monitoring data","coaches act","weekly report","simple report","report for the staff","dashboard for coaches","share data with coaches"],body:["Coaches act on reports that are short and clear:","- **One page:** three or four key numbers, then the **exceptions** (who is flagged and why), then one recommended action each.","- Use **traffic lights with the thresholds explained** (for example workload ratio above 1.5, low recovery) so nobody has to guess.","- Compare each athlete with **their own baseline;** show trends, not just today.","- Deliver at the **same time every week,** before the planning meeting, and follow up on what was decided.","- Keep data quality visible (missing sessions, partial files) so numbers are not over-trusted.","The dashboard alerts and the CSV exports in each section give a starting point for the weekly report."]},he:{title:"\u05D4\u05E6\u05D2\u05EA \u05E0\u05EA\u05D5\u05E0\u05D9 \u05E0\u05D9\u05D8\u05D5\u05E8 \u05D5\u05D3\u05D5\u05D7\u05D5\u05EA \u05E9\u05D1\u05D5\u05E2\u05D9\u05D9\u05DD",keys:["\u05DE\u05E6\u05D9\u05D2\u05D9\u05DD \u05E0\u05EA\u05D5\u05E0\u05D9 \u05E0\u05D9\u05D8\u05D5\u05E8","\u05E0\u05EA\u05D5\u05E0\u05D9 \u05E0\u05D9\u05D8\u05D5\u05E8","\u05D4\u05DE\u05D0\u05DE\u05E0\u05D9\u05DD \u05D9\u05E4\u05E2\u05DC\u05D5","\u05D3\u05D5\u05D7 \u05E9\u05D1\u05D5\u05E2\u05D9","\u05D3\u05D5\u05D7 \u05E4\u05E9\u05D5\u05D8","\u05D3\u05D5\u05D7 \u05DC\u05E6\u05D5\u05D5\u05EA","\u05DC\u05E9\u05EA\u05E3 \u05E0\u05EA\u05D5\u05E0\u05D9\u05DD \u05E2\u05DD \u05DE\u05D0\u05DE\u05E0\u05D9\u05DD"],body:["\u05DE\u05D0\u05DE\u05E0\u05D9\u05DD \u05E4\u05D5\u05E2\u05DC\u05D9\u05DD \u05DC\u05E4\u05D9 \u05D3\u05D5\u05D7\u05D5\u05EA \u05E7\u05E6\u05E8\u05D9\u05DD \u05D5\u05D1\u05E8\u05D5\u05E8\u05D9\u05DD:","- **\u05E2\u05DE\u05D5\u05D3 \u05D0\u05D7\u05D3:** \u05E9\u05DC\u05D5\u05E9\u05D4 \u05D0\u05D5 \u05D0\u05E8\u05D1\u05E2\u05D4 \u05DE\u05E1\u05E4\u05E8\u05D9\u05DD \u05DE\u05E8\u05DB\u05D6\u05D9\u05D9\u05DD, \u05D0\u05D7\u05E8 \u05DB\u05DA **\u05D4\u05D7\u05E8\u05D9\u05D2\u05D9\u05DD** (\u05DE\u05D9 \u05DE\u05E1\u05D5\u05DE\u05DF \u05D5\u05DC\u05DE\u05D4), \u05D5\u05D0\u05D6 \u05E4\u05E2\u05D5\u05DC\u05D4 \u05DE\u05D5\u05DE\u05DC\u05E6\u05EA \u05D0\u05D7\u05EA \u05DC\u05DB\u05DC \u05D0\u05D7\u05D3.","- \u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1**\u05E8\u05DE\u05D6\u05D5\u05E8\u05D9\u05DD \u05E2\u05DD \u05D4\u05E1\u05E3 \u05D4\u05DE\u05D5\u05E1\u05D1\u05E8** (\u05DC\u05DE\u05E9\u05DC \u05D9\u05D7\u05E1 \u05E2\u05D5\u05DE\u05E1 \u05DE\u05E2\u05DC 1.5, \u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA \u05E0\u05DE\u05D5\u05DB\u05D4) \u05DB\u05D3\u05D9 \u05E9\u05D0\u05D9\u05E9 \u05DC\u05D0 \u05D9\u05E6\u05D8\u05E8\u05DA \u05DC\u05E0\u05D7\u05E9.","- \u05DE\u05E9\u05D5\u05D5\u05D9\u05DD \u05DB\u05DC \u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9 \u05DC**\u05D1\u05E1\u05D9\u05E1 \u05D4\u05D0\u05D9\u05E9\u05D9 \u05E9\u05DC\u05D5;** \u05DE\u05E6\u05D9\u05D2\u05D9\u05DD \u05DE\u05D2\u05DE\u05D5\u05EA \u05D5\u05DC\u05D0 \u05E8\u05E7 \u05D0\u05EA \u05D4\u05D9\u05D5\u05DD.","- \u05DE\u05D5\u05E1\u05E8\u05D9\u05DD \u05D1**\u05D0\u05D5\u05EA\u05D4 \u05E9\u05E2\u05D4 \u05D1\u05DB\u05DC \u05E9\u05D1\u05D5\u05E2,** \u05DC\u05E4\u05E0\u05D9 \u05E4\u05D2\u05D9\u05E9\u05EA \u05D4\u05EA\u05DB\u05E0\u05D5\u05DF, \u05D5\u05E2\u05D5\u05E7\u05D1\u05D9\u05DD \u05D0\u05D7\u05E8\u05D9 \u05DE\u05D4 \u05E9\u05D4\u05D5\u05D7\u05DC\u05D8.","- \u05DE\u05E9\u05D0\u05D9\u05E8\u05D9\u05DD \u05D0\u05EA \u05D0\u05D9\u05DB\u05D5\u05EA \u05D4\u05E0\u05EA\u05D5\u05E0\u05D9\u05DD \u05D2\u05DC\u05D5\u05D9\u05D4 (\u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD \u05D7\u05E1\u05E8\u05D9\u05DD, \u05E7\u05D1\u05E6\u05D9\u05DD \u05D7\u05DC\u05E7\u05D9\u05D9\u05DD) \u05DB\u05D3\u05D9 \u05E9\u05DC\u05D0 \u05D9\u05D1\u05D8\u05D7\u05D5 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D3\u05D9 \u05D1\u05DE\u05E1\u05E4\u05E8\u05D9\u05DD.","\u05D4\u05EA\u05E8\u05D0\u05D5\u05EA \u05D4\u05D3\u05E9\u05D1\u05D5\u05E8\u05D3 \u05D5\u05D9\u05D9\u05E6\u05D5\u05D0 \u05D4-CSV \u05D1\u05DB\u05DC \u05DE\u05D3\u05D5\u05E8 \u05E0\u05D5\u05EA\u05E0\u05D9\u05DD \u05E0\u05E7\u05D5\u05D3\u05EA \u05E4\u05EA\u05D9\u05D7\u05D4 \u05DC\u05D3\u05D5\u05D7 \u05D4\u05E9\u05D1\u05D5\u05E2\u05D9."]}},{id:"wellness-quality",roles:y,en:{title:"Making wellness questionnaires useful",keys:["wellness questionnaire","wellness questionnaires","questionnaire","check-in","check in","reliable enough","self-report","readiness survey"],body:["Self-report works when athletes trust it and see it used:","- Keep it **short** (five to seven items) and the same every day, at the same time, before training.","- Look at **change from the athlete's own baseline,** not absolute scores or comparisons between athletes.","- **Close the loop:** respond to flags quickly and say what you did; athletes stop answering when nothing happens.","- Never punish an honest low score. Make it clear the data is for adjusting training and care.","- Treat it as one signal; combine it with load, sleep and what you see in person.","Athletes submit the check-in in **Readiness**; staff see flags on the dashboard."]},he:{title:"\u05D0\u05D9\u05DA \u05E9\u05D0\u05DC\u05D5\u05E0\u05D9 \u05E8\u05D5\u05D5\u05D7\u05D4 \u05D4\u05D5\u05E4\u05DB\u05D9\u05DD \u05DC\u05E9\u05D9\u05DE\u05D5\u05E9\u05D9\u05D9\u05DD",keys:["\u05E9\u05D0\u05DC\u05D5\u05E0\u05D9 \u05E8\u05D5\u05D5\u05D7\u05D4","\u05E9\u05D0\u05DC\u05D5\u05DF \u05E8\u05D5\u05D5\u05D7\u05D4","\u05E9\u05D0\u05DC\u05D5\u05DF","\u05D3\u05D9\u05D5\u05D5\u05D7 \u05E2\u05E6\u05DE\u05D9","\u05D0\u05DE\u05D9\u05E0\u05D9\u05DD \u05DE\u05E1\u05E4\u05D9\u05E7","\u05E6'\u05E7 \u05D0\u05D9\u05DF","\u05D1\u05D3\u05D9\u05E7\u05EA \u05D1\u05D5\u05E7\u05E8"],body:["\u05D3\u05D9\u05D5\u05D5\u05D7 \u05E2\u05E6\u05DE\u05D9 \u05E2\u05D5\u05D1\u05D3 \u05DB\u05E9\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9\u05DD \u05E1\u05D5\u05DE\u05DB\u05D9\u05DD \u05E2\u05DC\u05D9\u05D5 \u05D5\u05E8\u05D5\u05D0\u05D9\u05DD \u05E9\u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1\u05D5:","- \u05E9\u05D5\u05DE\u05E8\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 **\u05E7\u05E6\u05E8** (\u05D7\u05DE\u05E9 \u05E2\u05D3 \u05E9\u05D1\u05E2 \u05E9\u05D0\u05DC\u05D5\u05EA) \u05D5\u05D6\u05D4\u05D4 \u05DB\u05DC \u05D9\u05D5\u05DD, \u05D1\u05D0\u05D5\u05EA\u05D4 \u05E9\u05E2\u05D4, \u05DC\u05E4\u05E0\u05D9 \u05D4\u05D0\u05D9\u05DE\u05D5\u05DF.","- \u05DE\u05E1\u05EA\u05DB\u05DC\u05D9\u05DD \u05E2\u05DC **\u05E9\u05D9\u05E0\u05D5\u05D9 \u05DE\u05D4\u05D1\u05E1\u05D9\u05E1 \u05D4\u05D0\u05D9\u05E9\u05D9 \u05E9\u05DC \u05D4\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9,** \u05DC\u05D0 \u05E2\u05DC \u05E6\u05D9\u05D5\u05E0\u05D9\u05DD \u05DE\u05D5\u05D7\u05DC\u05D8\u05D9\u05DD \u05D0\u05D5 \u05D4\u05E9\u05D5\u05D5\u05D0\u05D4 \u05D1\u05D9\u05DF \u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9\u05DD.","- **\u05E1\u05D5\u05D2\u05E8\u05D9\u05DD \u05D0\u05EA \u05D4\u05DE\u05E2\u05D2\u05DC:** \u05DE\u05D2\u05D9\u05D1\u05D9\u05DD \u05DC\u05E1\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD \u05DE\u05D4\u05E8 \u05D5\u05D0\u05D5\u05DE\u05E8\u05D9\u05DD \u05DE\u05D4 \u05E2\u05E9\u05D9\u05EA\u05DD; \u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9\u05DD \u05DE\u05E4\u05E1\u05D9\u05E7\u05D9\u05DD \u05DC\u05E2\u05E0\u05D5\u05EA \u05DB\u05E9\u05DC\u05D0 \u05E7\u05D5\u05E8\u05D4 \u05DB\u05DC\u05D5\u05DD.","- \u05DC\u05E2\u05D5\u05DC\u05DD \u05DC\u05D0 \u05DE\u05E2\u05E0\u05D9\u05E9\u05D9\u05DD \u05E2\u05DC \u05E6\u05D9\u05D5\u05DF \u05E0\u05DE\u05D5\u05DA \u05DB\u05DF. \u05DE\u05D1\u05D4\u05D9\u05E8\u05D9\u05DD \u05E9\u05D4\u05E0\u05EA\u05D5\u05E0\u05D9\u05DD \u05E0\u05D5\u05E2\u05D3\u05D5 \u05DC\u05D4\u05EA\u05D0\u05DE\u05EA \u05D0\u05D9\u05DE\u05D5\u05DF \u05D5\u05D8\u05D9\u05E4\u05D5\u05DC.","- \u05DE\u05EA\u05D9\u05D9\u05D7\u05E1\u05D9\u05DD \u05DC\u05D6\u05D4 \u05DB\u05D0\u05D5\u05EA \u05D0\u05D7\u05D3; \u05DE\u05E9\u05DC\u05D1\u05D9\u05DD \u05E2\u05DD \u05E2\u05D5\u05DE\u05E1, \u05E9\u05D9\u05E0\u05D4 \u05D5\u05DE\u05D4 \u05E9\u05E8\u05D5\u05D0\u05D9\u05DD \u05D1\u05E2\u05D9\u05E0\u05D9\u05D9\u05DD.","\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9\u05DD \u05DE\u05DE\u05DC\u05D0\u05D9\u05DD \u05D0\u05EA \u05D4\u05E9\u05D0\u05DC\u05D5\u05DF \u05D1**\u05DE\u05D5\u05DB\u05E0\u05D5\u05EA**; \u05D4\u05E6\u05D5\u05D5\u05EA \u05E8\u05D5\u05D0\u05D4 \u05E1\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD \u05D1\u05D3\u05E9\u05D1\u05D5\u05E8\u05D3."]}},{id:"hamstring-rtr",roles:[...m],en:{title:"Hamstring return-to-run progression (general)",keys:["hamstring","return-to-run","return to run","return to running","sprint after injury","running after injury"],body:["General principles only; the treating clinician sets the criteria for each athlete.","- **Gate each step with criteria, not dates:** pain-free walking and daily activity, full or near-full range of motion, and strength close to the other side (commonly around 90 percent or better on hamstring strength tests).","- **Progress running through speeds:** easy running, then tempo, then progressive accelerations, then **high-speed and near-maximum sprinting** before full team training; hamstring risk is highest at top speed.","- Add **change of direction and sport-specific drills** after straight-line running is tolerated, and keep eccentric/hip-extension strength work going.","- Judge the **response in the next 24 hours** (pain, stiffness, wellness) before moving on.","- Return to full training and matches in steps, and build the plan together with the performance and coaching staff.","Record stages and clearance in **Injuries**; only authorised staff can clear."]},he:{title:"\u05D4\u05EA\u05E7\u05D3\u05DE\u05D5\u05EA \u05D1\u05D7\u05D6\u05E8\u05D4 \u05DC\u05E8\u05D9\u05E6\u05D4 \u05D0\u05D7\u05E8\u05D9 \u05E4\u05D2\u05D9\u05E2\u05D4 \u05D1\u05D9\u05E8\u05DA \u05D4\u05D0\u05D7\u05D5\u05E8\u05D9\u05EA (\u05DB\u05DC\u05DC\u05D9)",keys:["\u05D9\u05E8\u05DA \u05D0\u05D7\u05D5\u05E8\u05D9\u05EA","\u05D4\u05DE\u05E1\u05D8\u05E8\u05D9\u05E0\u05D2","\u05D7\u05D6\u05E8\u05D4 \u05DC\u05E8\u05D9\u05E6\u05D4","\u05E1\u05E4\u05E8\u05D9\u05E0\u05D8 \u05D0\u05D7\u05E8\u05D9 \u05E4\u05E6\u05D9\u05E2\u05D4","\u05E8\u05D9\u05E6\u05D4 \u05D0\u05D7\u05E8\u05D9 \u05E4\u05E6\u05D9\u05E2\u05D4"],body:["\u05E2\u05E7\u05E8\u05D5\u05E0\u05D5\u05EA \u05DB\u05DC\u05DC\u05D9\u05D9\u05DD \u05D1\u05DC\u05D1\u05D3; \u05D4\u05E7\u05DC\u05D9\u05E0\u05D0\u05D9 \u05D4\u05DE\u05D8\u05E4\u05DC \u05E7\u05D5\u05D1\u05E2 \u05D0\u05EA \u05D4\u05E7\u05E8\u05D9\u05D8\u05E8\u05D9\u05D5\u05E0\u05D9\u05DD \u05DC\u05DB\u05DC \u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9.","- **\u05E9\u05E2\u05E8\u05D9\u05DD \u05DC\u05DB\u05DC \u05E9\u05DC\u05D1 \u05DC\u05E4\u05D9 \u05E7\u05E8\u05D9\u05D8\u05E8\u05D9\u05D5\u05E0\u05D9\u05DD, \u05DC\u05D0 \u05EA\u05D0\u05E8\u05D9\u05DB\u05D9\u05DD:** \u05D4\u05DC\u05D9\u05DB\u05D4 \u05D5\u05D4\u05E4\u05E2\u05D9\u05DC\u05D5\u05EA \u05D4\u05D9\u05D5\u05DE\u05D9\u05D5\u05DE\u05D9\u05EA \u05DC\u05DC\u05D0 \u05DB\u05D0\u05D1, \u05D8\u05D5\u05D5\u05D7 \u05EA\u05E0\u05D5\u05E2\u05D4 \u05DE\u05DC\u05D0 \u05D0\u05D5 \u05DB\u05DE\u05E2\u05D8 \u05DE\u05DC\u05D0, \u05D5\u05DB\u05D5\u05D7 \u05E7\u05E8\u05D5\u05D1 \u05DC\u05E6\u05D3 \u05D4\u05E9\u05E0\u05D9 (\u05DC\u05E8\u05D5\u05D1 \u05E1\u05D1\u05D9\u05D1 90 \u05D0\u05D7\u05D5\u05D6 \u05D5\u05DE\u05E2\u05DC\u05D4 \u05D1\u05DE\u05D1\u05D3\u05E7\u05D9 \u05DB\u05D5\u05D7 \u05D9\u05E8\u05DA \u05D0\u05D7\u05D5\u05E8\u05D9\u05EA).","- **\u05DE\u05EA\u05E7\u05D3\u05DE\u05D9\u05DD \u05D1\u05E8\u05D9\u05E6\u05D4 \u05D3\u05E8\u05DA \u05DE\u05D4\u05D9\u05E8\u05D5\u05D9\u05D5\u05EA:** \u05E8\u05D9\u05E6\u05D4 \u05E7\u05DC\u05D4, \u05D0\u05D7\u05E8 \u05DB\u05DA \u05D8\u05DE\u05E4\u05D5, \u05D0\u05D7\u05E8 \u05DB\u05DA \u05D4\u05D0\u05E6\u05D5\u05EA \u05D4\u05D3\u05E8\u05D2\u05EA\u05D9\u05D5\u05EA, \u05D5\u05D0\u05D6 **\u05E8\u05D9\u05E6\u05D4 \u05DE\u05D4\u05D9\u05E8\u05D4 \u05D5\u05E1\u05E4\u05E8\u05D9\u05E0\u05D8 \u05E7\u05E8\u05D5\u05D1 \u05DC\u05DE\u05E7\u05E1\u05D9\u05DE\u05D5\u05DD** \u05DC\u05E4\u05E0\u05D9 \u05D0\u05D9\u05DE\u05D5\u05DF \u05E7\u05D1\u05D5\u05E6\u05EA\u05D9 \u05DE\u05DC\u05D0; \u05D4\u05E1\u05D9\u05DB\u05D5\u05DF \u05D1\u05D9\u05E8\u05DA \u05D4\u05D0\u05D7\u05D5\u05E8\u05D9\u05EA \u05D2\u05D1\u05D5\u05D4 \u05D1\u05D9\u05D5\u05EA\u05E8 \u05D1\u05DE\u05D4\u05D9\u05E8\u05D5\u05EA \u05E9\u05D9\u05D0.","- \u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD **\u05E9\u05D9\u05E0\u05D5\u05D9\u05D9 \u05DB\u05D9\u05D5\u05D5\u05DF \u05D5\u05EA\u05E8\u05D2\u05D9\u05DC\u05D9\u05DD \u05D9\u05D9\u05E2\u05D5\u05D3\u05D9\u05D9\u05DD \u05DC\u05E2\u05E0\u05E3** \u05D0\u05D7\u05E8\u05D9 \u05E9\u05E8\u05D9\u05E6\u05D4 \u05D9\u05E9\u05E8\u05D4 \u05E0\u05E1\u05D1\u05DC\u05EA, \u05D5\u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD \u05D1\u05E2\u05D1\u05D5\u05D3\u05EA \u05DB\u05D5\u05D7 \u05D0\u05E7\u05E1\u05E6\u05E0\u05D8\u05E8\u05D9\u05EA \u05D5\u05D4\u05D0\u05E8\u05DB\u05EA \u05D9\u05E8\u05DA.","- \u05D1\u05D5\u05D7\u05E0\u05D9\u05DD \u05D0\u05EA **\u05D4\u05EA\u05D2\u05D5\u05D1\u05D4 \u05D1-24 \u05D4\u05E9\u05E2\u05D5\u05EA \u05D4\u05D1\u05D0\u05D5\u05EA** (\u05DB\u05D0\u05D1, \u05E0\u05D5\u05E7\u05E9\u05D5\u05EA, \u05E8\u05D5\u05D5\u05D7\u05D4) \u05DC\u05E4\u05E0\u05D9 \u05E9\u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD.","- \u05D7\u05D5\u05D6\u05E8\u05D9\u05DD \u05DC\u05D0\u05D9\u05DE\u05D5\u05DF \u05DE\u05DC\u05D0 \u05D5\u05DC\u05DE\u05E9\u05D7\u05E7\u05D9\u05DD \u05D1\u05E9\u05DC\u05D1\u05D9\u05DD, \u05D5\u05D1\u05D5\u05E0\u05D9\u05DD \u05D0\u05EA \u05D4\u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05D9\u05D7\u05D3 \u05E2\u05DD \u05E6\u05D5\u05D5\u05EA \u05D4\u05D1\u05D9\u05E6\u05D5\u05E2\u05D9\u05DD \u05D5\u05D4\u05D0\u05D9\u05DE\u05D5\u05DF.","\u05E8\u05D5\u05E9\u05DE\u05D9\u05DD \u05E9\u05DC\u05D1\u05D9\u05DD \u05D5\u05D0\u05D9\u05E9\u05D5\u05E8 \u05D7\u05D6\u05E8\u05D4 \u05D1**\u05E4\u05E6\u05D9\u05E2\u05D5\u05EA**; \u05E8\u05E7 \u05E6\u05D5\u05D5\u05EA \u05DE\u05D5\u05E8\u05E9\u05D4 \u05D9\u05DB\u05D5\u05DC \u05DC\u05D0\u05E9\u05E8."]}},{id:"graded-loading",roles:["physiotherapist","personal_trainer","head_of_performance","head_coach","team_staff","athlete"],en:{title:"Explaining graded loading to a player who wants to rush back",keys:["graded loading","graded load","rush back","rushing back","too fast","come back too soon","slow progression","load tolerance"],body:["Healing tissue gets stronger by being loaded **a little more than it was last week,** not by being rested or overloaded.",'- Use a simple picture: "the tissue adapts to what we ask, and we raise the ask in steps it can take."',"- Agree **criteria** (pain level during and after, range, strength, running load) rather than dates, so progress is in the player's hands.","- A commonly used guide: mild discomfort that settles within about a day is acceptable; sharp or lingering pain means hold the step.","- Show what they **can** do each week; rushing back usually costs more time through re-injury.","- Set a clear return plan with the performance staff so the player is never idle while waiting.","Stage updates are recorded in **Injuries**, where the athlete can follow them too."]},he:{title:"\u05D4\u05E1\u05D1\u05E8 \u05D8\u05E2\u05D9\u05E0\u05D4 \u05DE\u05D3\u05D5\u05E8\u05D2\u05EA \u05DC\u05E9\u05D7\u05E7\u05DF \u05E9\u05DE\u05DE\u05D4\u05E8 \u05DC\u05D7\u05D6\u05D5\u05E8",keys:["\u05D8\u05E2\u05D9\u05E0\u05D4 \u05DE\u05D3\u05D5\u05E8\u05D2\u05EA","\u05D4\u05E2\u05DE\u05E1\u05D4 \u05DE\u05D3\u05D5\u05E8\u05D2\u05EA","\u05DE\u05DE\u05D4\u05E8 \u05DC\u05D7\u05D6\u05D5\u05E8","\u05DC\u05DE\u05D4\u05E8 \u05DC\u05D7\u05D6\u05D5\u05E8","\u05DE\u05D4\u05E8 \u05DE\u05D3\u05D9","\u05D7\u05D5\u05D6\u05E8 \u05DE\u05D5\u05E7\u05D3\u05DD","\u05D4\u05EA\u05E7\u05D3\u05DE\u05D5\u05EA \u05D0\u05D9\u05D8\u05D9\u05EA","\u05E1\u05D1\u05D9\u05DC\u05D5\u05EA \u05DC\u05E2\u05D5\u05DE\u05E1"],body:["\u05E8\u05E7\u05DE\u05D4 \u05DE\u05D7\u05DC\u05D9\u05DE\u05D4 \u05DE\u05EA\u05D7\u05D6\u05E7\u05EA \u05DB\u05E9\u05DE\u05E2\u05DE\u05D9\u05E1\u05D9\u05DD \u05E2\u05DC\u05D9\u05D4 **\u05E7\u05E6\u05EA \u05D9\u05D5\u05EA\u05E8 \u05DE\u05E9\u05D1\u05D5\u05E2 \u05E9\u05E2\u05D1\u05E8,** \u05DC\u05D0 \u05DB\u05E9\u05DE\u05E0\u05D5\u05D7\u05D9\u05DD \u05D0\u05D5 \u05DB\u05E9\u05DE\u05E2\u05DE\u05D9\u05E1\u05D9\u05DD \u05D9\u05EA\u05E8 \u05E2\u05DC \u05D4\u05DE\u05D9\u05D3\u05D4.",'- \u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1\u05D3\u05D9\u05DE\u05D5\u05D9 \u05E4\u05E9\u05D5\u05D8: "\u05D4\u05E8\u05E7\u05DE\u05D4 \u05DE\u05E1\u05EA\u05D2\u05DC\u05EA \u05DC\u05DE\u05D4 \u05E9\u05D0\u05E0\u05D7\u05E0\u05D5 \u05DE\u05D1\u05E7\u05E9\u05D9\u05DD, \u05D5\u05D0\u05E0\u05D7\u05E0\u05D5 \u05DE\u05E2\u05DC\u05D9\u05DD \u05D0\u05EA \u05D4\u05D1\u05E7\u05E9\u05D4 \u05D1\u05E6\u05E2\u05D3\u05D9\u05DD \u05E9\u05D4\u05D9\u05D0 \u05DE\u05E1\u05D5\u05D2\u05DC\u05EA \u05DC\u05E7\u05D1\u05DC."',"- \u05DE\u05E1\u05DB\u05DE\u05D9\u05DD **\u05E7\u05E8\u05D9\u05D8\u05E8\u05D9\u05D5\u05E0\u05D9\u05DD** (\u05E8\u05DE\u05EA \u05DB\u05D0\u05D1 \u05D1\u05DE\u05D4\u05DC\u05DA \u05D5\u05D0\u05D7\u05E8\u05D9, \u05D8\u05D5\u05D5\u05D7, \u05DB\u05D5\u05D7, \u05E2\u05D5\u05DE\u05E1 \u05E8\u05D9\u05E6\u05D4) \u05D5\u05DC\u05D0 \u05EA\u05D0\u05E8\u05D9\u05DB\u05D9\u05DD, \u05DB\u05DA \u05E9\u05D4\u05D4\u05EA\u05E7\u05D3\u05DE\u05D5\u05EA \u05D1\u05D9\u05D3\u05D9 \u05D4\u05E9\u05D7\u05E7\u05DF.","- \u05DB\u05DC\u05DC \u05D0\u05E6\u05D1\u05E2 \u05E0\u05E4\u05D5\u05E5: \u05D0\u05D9 \u05E0\u05D5\u05D7\u05D5\u05EA \u05E7\u05DC\u05D4 \u05E9\u05E0\u05E8\u05D2\u05E2\u05EA \u05EA\u05D5\u05DA \u05D9\u05D5\u05DD \u05DE\u05E7\u05D5\u05D1\u05DC\u05EA; \u05DB\u05D0\u05D1 \u05D7\u05D3 \u05D0\u05D5 \u05DE\u05EA\u05DE\u05E9\u05DA \u05E4\u05D9\u05E8\u05D5\u05E9\u05D5 \u05DC\u05E2\u05E6\u05D5\u05E8 \u05D1\u05E9\u05DC\u05D1.","- \u05DE\u05E8\u05D0\u05D9\u05DD \u05DE\u05D4 \u05D4\u05D5\u05D0 **\u05D9\u05DB\u05D5\u05DC** \u05DC\u05E2\u05E9\u05D5\u05EA \u05D1\u05DB\u05DC \u05E9\u05D1\u05D5\u05E2; \u05DE\u05D4\u05D9\u05E8\u05D5\u05EA \u05D9\u05EA\u05E8 \u05D1\u05D7\u05D6\u05E8\u05D4 \u05E2\u05D5\u05DC\u05D4 \u05D1\u05D3\u05E8\u05DA \u05DB\u05DC\u05DC \u05D1\u05D9\u05D5\u05EA\u05E8 \u05D6\u05DE\u05DF \u05D1\u05D2\u05DC\u05DC \u05E4\u05E6\u05D9\u05E2\u05D4 \u05D7\u05D5\u05D6\u05E8\u05EA.","- \u05E7\u05D5\u05D1\u05E2\u05D9\u05DD \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05D7\u05D6\u05E8\u05D4 \u05D1\u05E8\u05D5\u05E8\u05D4 \u05E2\u05DD \u05E6\u05D5\u05D5\u05EA \u05D4\u05D1\u05D9\u05E6\u05D5\u05E2\u05D9\u05DD \u05DB\u05D3\u05D9 \u05E9\u05D4\u05E9\u05D7\u05E7\u05DF \u05DC\u05D0 \u05D9\u05D4\u05D9\u05D4 \u05D1\u05D8\u05DC \u05D1\u05D6\u05DE\u05DF \u05D4\u05D4\u05DE\u05EA\u05E0\u05D4.","\u05E2\u05D3\u05DB\u05D5\u05E0\u05D9 \u05E9\u05DC\u05D1\u05D9\u05DD \u05E0\u05E8\u05E9\u05DE\u05D9\u05DD \u05D1**\u05E4\u05E6\u05D9\u05E2\u05D5\u05EA**, \u05E9\u05DD \u05D2\u05DD \u05D4\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9 \u05D9\u05DB\u05D5\u05DC \u05DC\u05E2\u05E7\u05D5\u05D1."]}},{id:"rtp-criteria",roles:y,en:{title:"Return-to-play decisions and criteria",keys:["return to play","return-to-play","clearance","cleared","clear a player","ready to play","back to training","rtp"],body:["Return to play is a **step-by-step process with criteria,** decided by qualified medical staff together with the coach and performance staff:","1. **Clinical:** pain, swelling and range of motion settled.","2. **Function and strength:** tests close to the other side or to the athlete's own baseline.","3. **Load tolerance:** running, high-speed and sport-specific drills progressed without a bad response.","4. **Team training** in stages, then **match minutes** built up.","5. **Psychological readiness:** the athlete trusts the body again.","In this app the stages run from rest to cleared in **Injuries**; clearance needs a written basis and can only be recorded by authorised staff (the physiotherapist, head coach and head of performance). This assistant cannot diagnose or clear anyone."]},he:{title:"\u05D4\u05D7\u05DC\u05D8\u05D5\u05EA \u05D5\u05E7\u05E8\u05D9\u05D8\u05E8\u05D9\u05D5\u05E0\u05D9\u05DD \u05DC\u05D7\u05D6\u05E8\u05D4 \u05DC\u05DE\u05E9\u05D7\u05E7",keys:["\u05D7\u05D6\u05E8\u05D4 \u05DC\u05DE\u05E9\u05D7\u05E7","\u05D7\u05D6\u05E8\u05D4 \u05DC\u05E4\u05E2\u05D9\u05DC\u05D5\u05EA","\u05D0\u05D9\u05E9\u05D5\u05E8 \u05D7\u05D6\u05E8\u05D4","\u05DC\u05D0\u05E9\u05E8 \u05E9\u05D7\u05E7\u05DF","\u05DE\u05D5\u05DB\u05DF \u05DC\u05E9\u05D7\u05E7","\u05D7\u05D6\u05E8\u05D4 \u05DC\u05D0\u05D9\u05DE\u05D5\u05DF","rtp"],body:["\u05D7\u05D6\u05E8\u05D4 \u05DC\u05DE\u05E9\u05D7\u05E7 \u05D4\u05D9\u05D0 **\u05EA\u05D4\u05DC\u05D9\u05DA \u05DE\u05D3\u05D5\u05E8\u05D2 \u05E2\u05DD \u05E7\u05E8\u05D9\u05D8\u05E8\u05D9\u05D5\u05E0\u05D9\u05DD,** \u05E9\u05DE\u05D5\u05D7\u05DC\u05D8 \u05D1\u05D9\u05D3\u05D9 \u05E6\u05D5\u05D5\u05EA \u05E8\u05E4\u05D5\u05D0\u05D9 \u05DE\u05D5\u05E1\u05DE\u05DA \u05D9\u05D7\u05D3 \u05E2\u05DD \u05D4\u05DE\u05D0\u05DE\u05DF \u05D5\u05E6\u05D5\u05D5\u05EA \u05D4\u05D1\u05D9\u05E6\u05D5\u05E2\u05D9\u05DD:","1. **\u05E7\u05DC\u05D9\u05E0\u05D9:** \u05DB\u05D0\u05D1, \u05E0\u05E4\u05D9\u05D7\u05D5\u05EA \u05D5\u05D8\u05D5\u05D5\u05D7 \u05EA\u05E0\u05D5\u05E2\u05D4 \u05D4\u05EA\u05D9\u05D9\u05E6\u05D1\u05D5.","2. **\u05EA\u05E4\u05E7\u05D5\u05D3 \u05D5\u05DB\u05D5\u05D7:** \u05DE\u05D1\u05D3\u05E7\u05D9\u05DD \u05E7\u05E8\u05D5\u05D1\u05D9\u05DD \u05DC\u05E6\u05D3 \u05D4\u05E9\u05E0\u05D9 \u05D0\u05D5 \u05DC\u05D1\u05E1\u05D9\u05E1 \u05D4\u05D0\u05D9\u05E9\u05D9 \u05E9\u05DC \u05D4\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9.","3. **\u05E1\u05D1\u05D9\u05DC\u05D5\u05EA \u05DC\u05E2\u05D5\u05DE\u05E1:** \u05E8\u05D9\u05E6\u05D4, \u05E8\u05D9\u05E6\u05D4 \u05DE\u05D4\u05D9\u05E8\u05D4 \u05D5\u05EA\u05E8\u05D2\u05D9\u05DC\u05D9\u05DD \u05D9\u05D9\u05E2\u05D5\u05D3\u05D9\u05D9\u05DD \u05D4\u05EA\u05E7\u05D3\u05DE\u05D5 \u05D1\u05DC\u05D9 \u05EA\u05D2\u05D5\u05D1\u05D4 \u05D2\u05E8\u05D5\u05E2\u05D4.","4. **\u05D0\u05D9\u05DE\u05D5\u05DF \u05E7\u05D1\u05D5\u05E6\u05EA\u05D9** \u05D1\u05E9\u05DC\u05D1\u05D9\u05DD, \u05D5\u05D0\u05D6 **\u05D1\u05E0\u05D9\u05D9\u05EA \u05D3\u05E7\u05D5\u05EA \u05DE\u05E9\u05D7\u05E7.**","5. **\u05DE\u05D5\u05DB\u05E0\u05D5\u05EA \u05E0\u05E4\u05E9\u05D9\u05EA:** \u05D4\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9 \u05E1\u05D5\u05DE\u05DA \u05E9\u05D5\u05D1 \u05E2\u05DC \u05D4\u05D2\u05D5\u05E3.","\u05D1\u05D0\u05E4\u05DC\u05D9\u05E7\u05E6\u05D9\u05D4 \u05D4\u05E9\u05DC\u05D1\u05D9\u05DD \u05E8\u05E6\u05D9\u05DD \u05DE\u05DE\u05E0\u05D5\u05D7\u05D4 \u05E2\u05D3 \u05D0\u05D9\u05E9\u05D5\u05E8 \u05D1**\u05E4\u05E6\u05D9\u05E2\u05D5\u05EA**; \u05D0\u05D9\u05E9\u05D5\u05E8 \u05D3\u05D5\u05E8\u05E9 \u05E0\u05D9\u05DE\u05D5\u05E7 \u05DB\u05EA\u05D5\u05D1 \u05D5\u05D9\u05DB\u05D5\u05DC \u05DC\u05D4\u05D9\u05E8\u05E9\u05DD \u05E8\u05E7 \u05D1\u05D9\u05D3\u05D9 \u05E6\u05D5\u05D5\u05EA \u05DE\u05D5\u05E8\u05E9\u05D4 (\u05E4\u05D9\u05D6\u05D9\u05D5\u05EA\u05E8\u05E4\u05D9\u05E1\u05D8, \u05DE\u05D0\u05DE\u05DF \u05E8\u05D0\u05E9\u05D9 \u05D5\u05E8\u05D0\u05E9 \u05D1\u05D9\u05E6\u05D5\u05E2\u05D9\u05DD). \u05D4\u05E2\u05D5\u05D6\u05E8 \u05D4\u05D6\u05D4 \u05DC\u05D0 \u05DE\u05D0\u05D1\u05D7\u05DF \u05D5\u05DC\u05D0 \u05DE\u05D0\u05E9\u05E8 \u05D7\u05D6\u05E8\u05D4 \u05DC\u05D0\u05D9\u05E9."]}},{id:"asymmetry",roles:["physiotherapist","head_of_performance","personal_trainer","head_coach","team_staff"],en:{title:"Asymmetry tests and GPS load together",keys:["asymmetry","asymmetries","limb difference","left and right","strength asymmetry","symmetry","side difference"],body:["Use asymmetry and load as **two inputs to a clinical decision:**","- **Limb difference** in strength or jump tests is most useful against the athlete's own pre-injury values; compare with the other side only where that is the best reference. Around 10 percent is a common flag, not a cut-off.","- Repeat tests under the same conditions; one noisy session proves little.","- Read **GPS load** alongside: has the athlete been exposed to high-speed running and sprinting at a level that matches the demands of matches?","- Agreement (symmetric strength and adequate exposure) supports progressing; disagreement tells you what to work on next.","Results are kept in **Testing** with trends and limb difference; GPS exposure is on the **GPS** page."]},he:{title:"\u05D0\u05E1\u05D9\u05DE\u05D8\u05E8\u05D9\u05D4 \u05D1\u05DB\u05D5\u05D7 \u05D5\u05E2\u05D5\u05DE\u05E1 GPS \u05D1\u05D9\u05D7\u05D3",keys:["\u05D0\u05E1\u05D9\u05DE\u05D8\u05E8\u05D9\u05D4","\u05D0\u05E1\u05D9\u05DE\u05D8\u05E8\u05D9\u05D9\u05EA","\u05D4\u05D1\u05D3\u05DC \u05D1\u05D9\u05DF \u05D4\u05E6\u05D3\u05D3\u05D9\u05DD","\u05D9\u05DE\u05D9\u05DF \u05D5\u05E9\u05DE\u05D0\u05DC","\u05E1\u05D9\u05DE\u05D8\u05E8\u05D9\u05D4","\u05D4\u05E4\u05E8\u05E9 \u05D1\u05D9\u05DF \u05D4\u05E8\u05D2\u05DC\u05D9\u05D9\u05DD"],body:["\u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1\u05D0\u05E1\u05D9\u05DE\u05D8\u05E8\u05D9\u05D4 \u05D5\u05D1\u05E2\u05D5\u05DE\u05E1 \u05DB**\u05E9\u05E0\u05D9 \u05E0\u05EA\u05D5\u05E0\u05D9\u05DD \u05DC\u05D4\u05D7\u05DC\u05D8\u05D4 \u05E7\u05DC\u05D9\u05E0\u05D9\u05EA:**","- **\u05D4\u05E4\u05E8\u05E9 \u05D1\u05D9\u05DF \u05D4\u05E6\u05D3\u05D3\u05D9\u05DD** \u05D1\u05DE\u05D1\u05D3\u05E7\u05D9 \u05DB\u05D5\u05D7 \u05D0\u05D5 \u05E7\u05E4\u05D9\u05E6\u05D4 \u05E9\u05D9\u05DE\u05D5\u05E9\u05D9 \u05D1\u05D9\u05D5\u05EA\u05E8 \u05DE\u05D5\u05DC \u05E2\u05E8\u05DB\u05D9 \u05D4\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9 \u05E2\u05E6\u05DE\u05D5 \u05DC\u05E4\u05E0\u05D9 \u05D4\u05E4\u05E6\u05D9\u05E2\u05D4; \u05DE\u05E9\u05D5\u05D5\u05D9\u05DD \u05DC\u05E6\u05D3 \u05D4\u05E9\u05E0\u05D9 \u05E8\u05E7 \u05DB\u05E9\u05D4\u05D5\u05D0 \u05D4\u05D9\u05D9\u05D7\u05D5\u05E1 \u05D4\u05D8\u05D5\u05D1 \u05D1\u05D9\u05D5\u05EA\u05E8. \u05DB-10 \u05D0\u05D7\u05D5\u05D6 \u05D4\u05D5\u05D0 \u05E1\u05D9\u05DE\u05D5\u05DF \u05E0\u05E4\u05D5\u05E5, \u05DC\u05D0 \u05E7\u05D5 \u05D7\u05D9\u05EA\u05D5\u05DA.","- \u05D7\u05D5\u05D6\u05E8\u05D9\u05DD \u05E2\u05DC \u05D4\u05DE\u05D1\u05D3\u05E7\u05D9\u05DD \u05D1\u05EA\u05E0\u05D0\u05D9\u05DD \u05D6\u05D4\u05D9\u05DD; \u05DE\u05E4\u05D2\u05E9 \u05E8\u05D5\u05E2\u05E9 \u05D0\u05D7\u05D3 \u05DE\u05D5\u05DB\u05D9\u05D7 \u05DE\u05E2\u05D8.","- \u05E7\u05D5\u05E8\u05D0\u05D9\u05DD \u05D0\u05EA **\u05E2\u05D5\u05DE\u05E1 \u05D4-GPS** \u05DC\u05E6\u05D3 \u05D6\u05D4: \u05D4\u05D0\u05DD \u05D4\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9 \u05E0\u05D7\u05E9\u05E3 \u05DC\u05E8\u05D9\u05E6\u05D4 \u05DE\u05D4\u05D9\u05E8\u05D4 \u05D5\u05E1\u05E4\u05E8\u05D9\u05E0\u05D8 \u05D1\u05E8\u05DE\u05D4 \u05E9\u05DE\u05EA\u05D0\u05D9\u05DE\u05D4 \u05DC\u05D3\u05E8\u05D9\u05E9\u05D5\u05EA \u05D4\u05DE\u05E9\u05D7\u05E7\u05D9\u05DD?","- \u05D4\u05E1\u05DB\u05DE\u05D4 (\u05DB\u05D5\u05D7 \u05E1\u05D9\u05DE\u05D8\u05E8\u05D9 \u05D5\u05D7\u05E9\u05D9\u05E4\u05D4 \u05DE\u05E1\u05E4\u05E7\u05EA) \u05EA\u05D5\u05DE\u05DB\u05EA \u05D1\u05D4\u05EA\u05E7\u05D3\u05DE\u05D5\u05EA; \u05E4\u05E2\u05E8 \u05DE\u05E8\u05D0\u05D4 \u05E2\u05DC \u05DE\u05D4 \u05DC\u05E2\u05D1\u05D5\u05D3.","\u05D4\u05EA\u05D5\u05E6\u05D0\u05D5\u05EA \u05E0\u05E9\u05DE\u05E8\u05D5\u05EA \u05D1**\u05DE\u05D1\u05D3\u05E7\u05D9\u05DD** \u05E2\u05DD \u05DE\u05D2\u05DE\u05D5\u05EA \u05D5\u05D4\u05E4\u05E8\u05E9 \u05D1\u05D9\u05DF \u05D4\u05E6\u05D3\u05D3\u05D9\u05DD; \u05D7\u05E9\u05D9\u05E4\u05EA GPS \u05D1\u05E2\u05DE\u05D5\u05D3 \u05D4-**GPS**."]}},{id:"program-structure",roles:[...m],en:{title:"Structuring a longer program",keys:["12-week","12 week","twelve week","structure a","program","programme","two sessions a week","amateur","plan for an athlete","periodise","build a plan"],body:["For a 12-week plan with two sessions a week, three 4-week blocks work well:","1. **Weeks 1 to 4, foundation:** technique and tissue tolerance (squat, hinge, single-leg, push, pull, trunk), moderate load.","2. **Weeks 5 to 8, build:** raise load (about 5 to 10 percent steps) and add power (jumps, throws).","3. **Weeks 9 to 12, transfer:** speed, change of direction and sport-specific work with the strength base maintained.","Each session: **warm-up, speed or power, strength, trunk, short cool-down.** Make week 4, 8 and 12 lighter (deload), progress reps first and load second, and track effort with RPE. Amateur players also have matches and work or study, so keep sessions to about an hour and adjust around fixtures.","In the app: **Training**, then new program, add sessions, and use the library or **Auto-build session** for a first draft you then edit."]},he:{title:"\u05D1\u05E0\u05D9\u05D9\u05EA \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05D0\u05E8\u05D5\u05DB\u05D4",keys:["12 \u05E9\u05D1\u05D5\u05E2\u05D5\u05EA","\u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05E9\u05DC","\u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD","\u05E9\u05E0\u05D9 \u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD \u05D1\u05E9\u05D1\u05D5\u05E2","\u05D7\u05D5\u05D1\u05D1","\u05DC\u05D1\u05E0\u05D5\u05EA \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA","\u05DE\u05D1\u05E0\u05D4 \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA"],body:["\u05DC\u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05E9\u05DC 12 \u05E9\u05D1\u05D5\u05E2\u05D5\u05EA \u05E2\u05DD \u05E9\u05E0\u05D9 \u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD \u05D1\u05E9\u05D1\u05D5\u05E2, \u05E9\u05DC\u05D5\u05E9\u05D4 \u05D1\u05DC\u05D5\u05E7\u05D9\u05DD \u05E9\u05DC 4 \u05E9\u05D1\u05D5\u05E2\u05D5\u05EA \u05E2\u05D5\u05D1\u05D3\u05D9\u05DD \u05D8\u05D5\u05D1:","1. **\u05E9\u05D1\u05D5\u05E2\u05D5\u05EA 1 \u05E2\u05D3 4, \u05D1\u05E1\u05D9\u05E1:** \u05D8\u05DB\u05E0\u05D9\u05E7\u05D4 \u05D5\u05E1\u05D1\u05D9\u05DC\u05D5\u05EA \u05E8\u05E7\u05DE\u05D5\u05EA (\u05E1\u05E7\u05D5\u05D5\u05D0\u05D8, \u05E6\u05D9\u05E8 \u05D9\u05E8\u05DA, \u05E8\u05D2\u05DC \u05D0\u05D7\u05EA, \u05D3\u05D7\u05D9\u05E4\u05D4, \u05DE\u05E9\u05D9\u05DB\u05D4, \u05D2\u05D5), \u05E2\u05D5\u05DE\u05E1 \u05D1\u05D9\u05E0\u05D5\u05E0\u05D9.","2. **\u05E9\u05D1\u05D5\u05E2\u05D5\u05EA 5 \u05E2\u05D3 8, \u05D1\u05E0\u05D9\u05D9\u05D4:** \u05DE\u05E2\u05DC\u05D9\u05DD \u05E2\u05D5\u05DE\u05E1 (\u05E6\u05E2\u05D3\u05D9\u05DD \u05E9\u05DC \u05DB-5 \u05E2\u05D3 10 \u05D0\u05D7\u05D5\u05D6) \u05D5\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05E2\u05D5\u05E6\u05DE\u05D4 (\u05E7\u05E4\u05D9\u05E6\u05D5\u05EA, \u05D6\u05E8\u05D9\u05E7\u05D5\u05EA).","3. **\u05E9\u05D1\u05D5\u05E2\u05D5\u05EA 9 \u05E2\u05D3 12, \u05D4\u05E2\u05D1\u05E8\u05D4:** \u05DE\u05D4\u05D9\u05E8\u05D5\u05EA, \u05E9\u05D9\u05E0\u05D5\u05D9\u05D9 \u05DB\u05D9\u05D5\u05D5\u05DF \u05D5\u05E2\u05D1\u05D5\u05D3\u05D4 \u05D9\u05D9\u05E2\u05D5\u05D3\u05D9\u05EA \u05DC\u05E2\u05E0\u05E3 \u05E2\u05DD \u05E9\u05D9\u05DE\u05D5\u05E8 \u05D1\u05E1\u05D9\u05E1 \u05D4\u05DB\u05D5\u05D7.","\u05DB\u05DC \u05D0\u05D9\u05DE\u05D5\u05DF: **\u05D7\u05D9\u05DE\u05D5\u05DD, \u05DE\u05D4\u05D9\u05E8\u05D5\u05EA \u05D0\u05D5 \u05E2\u05D5\u05E6\u05DE\u05D4, \u05DB\u05D5\u05D7, \u05D2\u05D5, \u05E1\u05D9\u05D5\u05DD \u05E7\u05E6\u05E8.** \u05E9\u05D1\u05D5\u05E2\u05D5\u05EA 4, 8 \u05D5-12 \u05E7\u05DC\u05D9\u05DD \u05D9\u05D5\u05EA\u05E8 (\u05D3\u05D9\u05DC\u05D5\u05D3), \u05DE\u05EA\u05E7\u05D3\u05DE\u05D9\u05DD \u05E7\u05D5\u05D3\u05DD \u05D1\u05D7\u05D6\u05E8\u05D5\u05EA \u05D5\u05D0\u05D7\u05E8 \u05DB\u05DA \u05D1\u05E2\u05D5\u05DE\u05E1, \u05D5\u05E2\u05D5\u05E7\u05D1\u05D9\u05DD \u05D0\u05D7\u05E8\u05D9 \u05DE\u05D0\u05DE\u05E5 \u05D1-RPE. \u05DC\u05E9\u05D7\u05E7\u05E0\u05D9 \u05D7\u05D5\u05D1\u05D1\u05D9\u05DD \u05D9\u05E9 \u05D2\u05DD \u05DE\u05E9\u05D7\u05E7\u05D9\u05DD \u05D5\u05E2\u05D1\u05D5\u05D3\u05D4 \u05D0\u05D5 \u05DC\u05D9\u05DE\u05D5\u05D3\u05D9\u05DD, \u05DC\u05DB\u05DF \u05E9\u05D5\u05DE\u05E8\u05D9\u05DD \u05E2\u05DC \u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD \u05E9\u05DC \u05DB\u05E9\u05E2\u05D4 \u05D5\u05DE\u05EA\u05D0\u05D9\u05DE\u05D9\u05DD \u05E1\u05D1\u05D9\u05D1 \u05D4\u05DE\u05E9\u05D7\u05E7\u05D9\u05DD.","\u05D1\u05D0\u05E4\u05DC\u05D9\u05E7\u05E6\u05D9\u05D4: **\u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD**, \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05D7\u05D3\u05E9\u05D4, \u05D4\u05D5\u05E1\u05E4\u05EA \u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD, \u05D5\u05D4\u05E1\u05E4\u05E8\u05D9\u05D9\u05D4 \u05D0\u05D5 **\u05D1\u05E0\u05D9\u05D9\u05EA \u05D0\u05D9\u05DE\u05D5\u05DF \u05D0\u05D5\u05D8\u05D5\u05DE\u05D8\u05D9\u05EA** \u05DC\u05D8\u05D9\u05D5\u05D8\u05D4 \u05E8\u05D0\u05E9\u05D5\u05E0\u05D4 \u05E9\u05D0\u05D5\u05EA\u05D4 \u05E2\u05D5\u05E8\u05DB\u05D9\u05DD."]}},{id:"poor-sleep-adjust",roles:[...m],en:{title:"Adjusting a program after poor sleep",keys:["poor sleep","bad sleep","slept badly","adjust a program","adjust the program","adjust training","tired athlete","fatigued","not slept","week of poor sleep"],body:["One bad night rarely needs a change; **a week of poor sleep does:**","- Cut **volume by about 10 to 30 percent** and keep the quality of the first sets; drop the last, sloppiest ones.","- Keep technique and speed work short and sharp; avoid maximum sprinting, heavy attempts near maximum and long hard conditioning while very tired.","- Check the wider picture: stress, exams, travel, illness, food, and the wellness trend in **Readiness**.","- Talk to the athlete about the cause and agree small sleep habits rather than just lowering load.","- Return to plan as sleep and wellness recover, and note the change in the session.","If sleep stays poor for weeks or is joined by low mood or frequent illness, refer to a doctor."]},he:{title:"\u05D4\u05EA\u05D0\u05DE\u05EA \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05D0\u05D7\u05E8\u05D9 \u05E9\u05D9\u05E0\u05D4 \u05D2\u05E8\u05D5\u05E2\u0 oks deformed or cannot bear weight after an injury; numbness, weakness or loss of bladder or bowel control.","**Refer promptly** when: pain is sharp, sudden or does not settle within a few days; there is significant swelling, locking or giving way; pain wakes you at night or is present at rest; symptoms keep returning in the same place; or a problem is not improving after one to two weeks of sensible load reduction.","Coaches and trainers should not diagnose; describe what you saw and refer. Record the injury in **Injuries** so the right staff can follow it.","When in doubt, refer. This assistant cannot diagnose."]},he:{title:"\u05DE\u05EA\u05D9 \u05DC\u05D4\u05E4\u05E0\u05D5\u05EA \u05DC\u05E4\u05D9\u05D6\u05D9\u05D5\u05EA\u05E8\u05E4\u05D9\u05E1\u05D8 \u05D0\u05D5 \u05DC\u05E8\u05D5\u05E4\u05D0",keys:["\u05DC\u05D4\u05E4\u05E0\u05D5\u05EA","\u05D4\u05E4\u05E0\u05D9\u05D4","\u05DC\u05E4\u05E0\u05D5\u05EA \u05DC\u05E8\u05D5\u05E4\u05D0","\u05DC\u05E4\u05E0\u05D5\u05EA \u05DC\u05E4\u05D9\u05D6\u05D9\u05D5","\u05E4\u05D9\u05D6\u05D9\u05D5\u05EA\u05E8\u05E4\u05D9\u05E1\u05D8 \u05D0\u05D5 \u05DC\u05E8\u05D5\u05E4\u05D0","\u05DE\u05EA\u05D9 \u05E6\u05E8\u05D9\u05DA","\u05D3\u05D2\u05DC \u05D0\u05D3\u05D5\u05DD","\u05D3\u05D2\u05DC\u05D9\u05DD \u05D0\u05D3\u05D5\u05DE\u05D9\u05DD"],body:["**\u05DE\u05E4\u05E0\u05D9\u05DD \u05DC\u05D8\u05D9\u05E4\u05D5\u05DC \u05D3\u05D7\u05D5\u05E3** (\u05D0\u05D5 \u05DE\u05EA\u05E7\u05E9\u05E8\u05D9\u05DD \u05DC\u05DE\u05E1\u05E4\u05E8 \u05D4\u05D7\u05D9\u05E8\u05D5\u05DD \u05D4\u05DE\u05E7\u05D5\u05DE\u05D9) \u05DB\u05E9\u05D9\u05E9: \u05E4\u05D2\u05D9\u05E2\u05EA \u05E8\u05D0\u05E9 \u05E2\u05DD \u05D1\u05DC\u05D1\u05D5\u05DC, \u05DB\u05D0\u05D1 \u05E8\u05D0\u05E9, \u05D4\u05E7\u05D0\u05D5\u05EA \u05D0\u05D5 \u05D0\u05D9\u05D1\u05D5\u05D3 \u05D4\u05DB\u05E8\u05D4; \u05DB\u05D0\u05D1 \u05D1\u05D7\u05D6\u05D4, \u05D4\u05EA\u05E2\u05DC\u05E4\u05D5\u05EA \u05D0\u05D5 \u05E7\u05D5\u05E6\u05E8 \u05E0\u05E9\u05D9\u05DE\u05D4 \u05D7\u05E8\u05D9
