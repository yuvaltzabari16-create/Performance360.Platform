<style>
/* Performance360 Academy design tokens: the brand scale is built from the logo's deep green (600) and bright green (500). */
:root {
  --brand-50: #edf7ef; --brand-100: #d5eedb; --brand-200: #abdcb7; --brand-300: #78c58a; --brand-400: #52b763;
  --brand-500: #3fae4f; --brand-600: #0b5a3a; --brand-700: #094c31; --brand-800: #073e28; --brand-900: #05301f;

  --shadow-card: 0 1px 1px rgba(16,40,28,.03), 0 8px 24px -12px rgba(16,70,45,.16);
  --shadow-lift: 0 1px 2px rgba(16,40,28,.05), 0 20px 44px -18px rgba(16,70,45,.26);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Heebo", ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --brand-50: #10241a; --brand-100: #153222; --brand-200: #1c472f; --brand-300: #2b7445; --brand-400: #3ea657;
  --brand-500: #4cc463; --brand-600: #2f9a4c; --brand-700: #7fd9a8; --brand-800: #a6e6c3; --brand-900: #cdf3de;
  --logo-deep: #7fd9a8; --logo-bright: #4cc463;
  --ink: #f1f5f3; --ink-soft: #bbc5c1; --muted: #8c9893; --line: #2a3330; --surface: #161c1a; --canvas: #0b0f0d; --mint: #12261b;
  --red: #ff8a84; --red-soft: #2a1416; --amber: #f3c76a; --amber-soft: #2b2110; --blue: #8fd0f2; --blue-soft: #10222c;
  --shadow-card: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-lift: 0 1px 0 rgba(255,255,255,.05) inset, 0 24px 48px -18px rgba(0,0,0,.8);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --brand-50: #10241a; --brand-100: #153222; --brand-200: #1c472f; --brand-300: #2b7445; --brand-400: #3ea657;
  --brand-500: #4cc463; --brand-600: #2f9a4c; --brand-700: #7fd9a8; --brand-800: #a6e6c3; --brand-900: #cdf3de;
  --logo-deep: #7fd9a8; --logo-bright: #4cc463;
  --ink: #f1f5f3; --ink-soft: #bbc5c1; --muted: #8c9893; --line: #2a3330; --surface: #161c1a; --canvas: #0b0f0d; --mint: #12261b;
  --red: #ff8a84; --red-soft: #2a1416; --amber: #f3c76a; --amber-soft: #2b2110; --blue: #8fd0f2; --blue-soft: #10222c;
  --shadow-card: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-lift: 0 1px 0 rgba(255,255,255,.05) inset, 0 24px 48px -18px rgba(0,0,0,.8);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--canvas);
  background-image: radial-gradient(56rem 34rem at 92% -8%, color-mix(in srgb, var(--brand-300) 30%, transparent), transparent 62%),
                    radial-gradient(44rem 30rem at -6% 12%, color-mix(in srgb, var(--brand-200) 40%, transparent), transparent 60%);
  background-attachment: fixed; color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(26px, 3.4vw, 34px); font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
h3 { font-size: 15px; font-weight: 650; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand-700); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--brand-500); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .soft { color: var(--ink-soft); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* logo */
.logo { display: inline-flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
.logo svg { width: 32px; height: 32px; flex: none; }
.logo b { color: var(--brand-500); font-weight: 650; } .logo i { font-style: normal; font-weight: 500; color: var(--ink-soft); }

/* auth screens */
.auth { min-height: 100vh; display: flex; flex-direction: column; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
.auth-top { display: flex; justify-content: space-between; align-items: center; max-width: 1180px; width: 100%; margin: 0 auto 28px; }
.auth-card { width: min(460px, 100%); margin: auto; background: color-mix(in srgb, var(--surface) 94%, transparent); border-radius: 28px; box-shadow: var(--shadow-lift); border: 1px solid var(--line); padding: 30px; display: grid; gap: 16px; }
.code-input { text-align: center; font: 700 26px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .3em; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--canvas); border: 1px solid var(--line); border-radius: 14px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 7px 10px; cursor: pointer; color: var(--ink-soft); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-card); }
.choice { display: grid; gap: 4px; text-align: start; width: 100%; padding: 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.choice:hover { border-color: var(--brand-400); background: var(--brand-50); }

/* shell */
.app { display: grid; grid-template-columns: 288px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 16px; }
.side-in { height: 100%; display: flex; flex-direction: column; border-radius: 28px; box-shadow: var(--shadow-lift); border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(18px); overflow: hidden; }
.side .logo { padding: 22px 22px 14px; }
.nav { flex: 1; overflow-y: auto; padding: 4px 12px; display: grid; gap: 2px; align-content: start; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 14px; border: 0; border-radius: 12px; background: transparent; color: var(--ink-soft); cursor: pointer; text-align: start; font-size: 15px; }
.nav button svg, .tabbar svg { width: 19px; height: 19px; flex: none; color: var(--brand-600); }
.nav button:hover { background: var(--brand-50); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--brand-600); color: var(--on-brand); font-weight: 600; box-shadow: 0 6px 14px -8px rgba(11,90,58,.8); }
.nav button[aria-current="page"] svg { color: var(--on-brand); }
.nav .badge { margin-inline-start: auto; background: var(--red); color: #fff; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 0 6px; }
.who { border-top: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 10px; }
.who-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 12px; font-weight: 700; background: var(--brand-100); color: var(--brand-800); }
.avatar.sm { width: 30px; height: 30px; font-size: 11px; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.topbar, .tabbar { display: none; }
main { min-width: 0; padding: 32px max(24px, env(safe-area-inset-right, 0px)) 64px max(24px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 1160px; margin: 0 auto; display: grid; gap: 22px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.head > div:first-child { min-width: 0; display: grid; gap: 4px; }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 30; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(18px); border-bottom: 1px solid var(--line); }
  .tabbar { display: flex; position: fixed; inset: auto 0 0 0; z-index: 30; background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(18px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar button { flex: 1; display: grid; justify-items: center; gap: 2px; border: 0; background: none; color: var(--muted); font-size: 10.5px; font-weight: 500; padding: 4px 2px; cursor: pointer; min-width: 0; }
  .tabbar button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabbar button[aria-current="page"] { color: var(--brand-600); }
  main { padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
}
.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; }
.sheet-in { width: 100%; max-height: 80vh; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0; padding: 14px 12px calc(18px + env(safe-area-inset-bottom, 0px)); }

/* building blocks */
.card { background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-card); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.card-b { padding: 16px 20px; display: grid; gap: 12px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
@media (max-width: 1060px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: minmax(0, 1fr); } .split { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .g2 { grid-template-columns: minmax(0, 1fr); } }
.stat { padding: 16px 20px; display: grid; gap: 4px; }
.stat .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.list { display: grid; }
.list > * { padding-block: 10px; border-top: 1px solid var(--line); }
.list > *:first-child { border-top: 0; padding-top: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.row > div { min-width: 0; }
.stack { display: grid; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 13px; border: 1px solid transparent; background: var(--brand-600); color: var(--on-brand); font-weight: 600; font-size: 15px; cursor: pointer; white-space: nowrap; box-shadow: 0 6px 16px -8px rgba(11,90,58,.75); text-decoration: none; }
.btn:hover { background: var(--brand-700); }
:root[data-theme="dark"] .btn:hover { background: var(--brand-500); }
.btn.sec { background: var(--brand-50); color: var(--brand-700); box-shadow: none; }
.btn.sec:hover { background: var(--brand-100); }
.btn.ghost { background: transparent; color: var(--brand-700); box-shadow: none; }
.btn.danger { background: transparent; color: var(--red); box-shadow: none; }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--brand-700); cursor: pointer; font-size: 13px; font-weight: 500; }
.link:hover { text-decoration: underline; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 13.5px; font-weight: 550; color: var(--ink); }
.input, .select, .textarea { width: 100%; padding: 10px 13px; border-radius: 13px; border: 1px solid var(--line); background: var(--canvas); min-width: 0; }
.textarea { resize: vertical; min-height: 76px; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--brand-400); box-shadow: 0 0 0 3px var(--brand-100); }
.f2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.p-green { background: var(--brand-100); color: var(--brand-800); } .p-red { background: var(--red-soft); color: var(--red); }
.p-amber { background: var(--amber-soft); color: var(--amber); } .p-blue { background: var(--blue-soft); color: var(--blue); }
.p-gray { background: var(--canvas); color: var(--muted); border: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; color: var(--ink-soft); }
.chips button[aria-pressed="true"] { background: var(--brand-600); border-color: var(--brand-600); color: var(--on-brand); font-weight: 600; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: start; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 11px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 16px; border-top: 1px solid var(--line); vertical-align: middle; }
tr:first-child td { border-top: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--brand-50); }
.empty { padding: 26px; text-align: center; color: var(--muted); font-size: 14px; }
.loading { padding: 40px; text-align: center; color: var(--muted); }
.bubble { max-width: 82%; padding: 10px 14px; border-radius: 18px; font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.me { justify-self: end; background: linear-gradient(to bottom, var(--brand-500), var(--brand-600)); color: #fff; border-bottom-right-radius: 6px; }
.bubble.them { justify-self: start; background: var(--brand-50); border-bottom-left-radius: 6px; }
.thread { display: grid; gap: 8px; max-height: 460px; overflow-y: auto; padding: 4px; }
.contacts button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: transparent; border-radius: 12px; cursor: pointer; text-align: start; }
.contacts button:hover { background: var(--canvas); }
.contacts button[aria-current="true"] { background: var(--brand-50); }
.msg-grid { grid-template-columns: 280px minmax(0, 1fr); }
@media (max-width: 760px) { .msg-grid { grid-template-columns: minmax(0, 1fr); } }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: center; }
.cal button { min-height: 78px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 6px; text-align: start; cursor: pointer; display: grid; align-content: start; gap: 3px; min-width: 0; }
.cal button.out { opacity: .45; } .cal button.today { border-color: var(--brand-500); box-shadow: inset 0 0 0 1px var(--brand-500); }
.cal button[aria-pressed="true"] { background: var(--brand-50); }
.cal .d { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cal .ev { font-size: 11px; line-height: 1.25; padding: 2px 5px; border-radius: 6px; background: var(--blue-soft); color: var(--blue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal .ev.done { background: linear-gradient(to bottom, var(--brand-500), var(--brand-600)); color: #fff; }
@media (max-width: 640px) { .cal button { min-height: 52px; } .cal .ev { font-size: 0; height: 6px; padding: 0; } }
.meal { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; }
.meal img, .meal .ph { width: 96px; height: 96px; border-radius: 14px; object-fit: cover; }
.meal .ph { display: grid; place-items: center; background: var(--canvas); border: 1px dashed var(--line); color: var(--muted); font-size: 11px; text-align: center; }
.comment { background: var(--brand-50); color: var(--brand-800); border-radius: 12px; padding: 8px 11px; font-size: 13.5px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--font); }
.chart .gl { stroke: var(--line); } .chart .bar { fill: var(--brand-500); } .chart .bar.zero { fill: var(--brand-100); }
.chart .ln { stroke: var(--brand-500); stroke-width: 2.5; fill: none; } .chart .pt { fill: var(--surface); stroke: var(--brand-600); stroke-width: 2; }
.code-box { font: 700 24px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .2em; text-align: center; padding: 16px; border-radius: 16px; background: var(--brand-50); color: var(--brand-800); border: 1px solid var(--brand-200); overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--canvas); padding: 11px 17px; border-radius: 14px; font-size: 14px; box-shadow: var(--shadow-lift); max-width: calc(100% - 32px); }
@media (min-width: 901px) { .toast { bottom: 24px; } }
.toast.err { background: var(--red); color: #fff; }
.notice { border-radius: 14px; padding: 11px 14px; font-size: 14px; }
.notice.err { background: var(--red-soft); color: var(--red); } .notice.ok { background: var(--brand-50); color: var(--brand-800); }
.answer { white-space: pre-wrap; }
.theme-switch { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--canvas); border: 1px solid var(--line); }
.theme-switch button { border: 0; background: none; padding: 4px 9px; border-radius: 9px; font-size: 12px; color: var(--ink-soft); cursor: pointer; }
.theme-switch button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-card); }
@media (prefers-reduced-motion: no-preference) { .fade { animation: fade .22s ease both; } @keyframes fade { from { opacity: .5; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>

EA\u05E0\u05D5\u05DE\u05D4 \u05E7\u05E6\u05E8\u05D4 \u05D1\u05E6\u05D4\u05E8\u05D9\u05D9\u05DD \u05D0\u05DD \u05D4\u05DC\u05D9\u05DC\u05D4 \u05D4\u05D9\u05D4 \u05E7\u05E6\u05E8.","- **\u05EA\u05E0\u05D5\u05E2\u05D4 \u05E7\u05DC\u05D4 \u05DC\u05DE\u05D7\u05E8\u05EA:** \u05D4\u05DC\u05D9\u05DB\u05D4, \u05D0\u05D5\u05E4\u05E0\u05D9\u05D9\u05DD \u05E7\u05DC\u05D9\u05DD \u05D0\u05D5 \u05E0\u05D9\u05D9\u05D3\u05D5\u05EA \u05E2\u05D3\u05D9\u05E4\u05D9\u05DD \u05E2\u05DC \u05E9\u05DB\u05D9\u05D1\u05D4; \u05D7\u05E9\u05D5\u05D1 \u05DC\u05E9\u05DE\u05D5\u05E8 \u05E2\u05DC \u05E2\u05E6\u05D9\u05DE\u05D5\u05EA \u05E0\u05DE\u05D5\u05DB\u05D4.","- **\u05DC\u05EA\u05DB\u05E0\u05DF \u05D0\u05EA \u05D4\u05D0\u05D9\u05DE\u05D5\u05DF \u05D4\u05E7\u05E9\u05D4 \u05D4\u05D1\u05D0 \u05DC\u05E4\u05D9 \u05D4\u05EA\u05D7\u05D5\u05E9\u05D4** \u05D5\u05DC\u05D0 \u05E8\u05E7 \u05DC\u05E4\u05D9 \u05DC\u05D5\u05D7 \u05D4\u05D6\u05DE\u05E0\u05D9\u05DD. \u05E8\u05D2\u05DC\u05D9\u05D9\u05DD \u05DB\u05D1\u05D3\u05D5\u05EA \u05D5\u05DB\u05D0\u05D1\u05D9 \u05E9\u05E8\u05D9\u05E8\u05D9\u05DD \u05D7\u05D6\u05E7\u05D9\u05DD \u05DE\u05E6\u05D3\u05D9\u05E7\u05D9\u05DD \u05D0\u05D9\u05DE\u05D5\u05DF \u05E7\u05DC \u05D9\u05D5\u05EA\u05E8, \u05DC\u05D0 \u05D1\u05D9\u05D8\u05D5\u05DC \u05E9\u05DC\u05D5.","- \u05D0\u05DE\u05D1\u05D8\u05D9\u05D9\u05EA \u05E7\u05E8\u05D7, \u05D2\u05E8\u05D1\u05D9 \u05DC\u05D7\u05E5 \u05D5\u05E2\u05D9\u05E1\u05D5\u05D9 \u05D9\u05DB\u05D5\u05DC\u05D9\u05DD \u05DC\u05E9\u05E4\u05E8 \u05D0\u05EA \u05D4\u05EA\u05D7\u05D5\u05E9\u05D4; \u05D4\u05E8\u05D0\u05D9\u05D5\u05EA \u05DC\u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA \u05DE\u05D4\u05D9\u05E8\u05D4 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05E2\u05D5\u05E8\u05D1\u05D5\u05EA, \u05DC\u05DB\u05DF \u05D4\u05DD \u05EA\u05D5\u05E1\u05E4\u05EA \u05D1\u05DC\u05D1\u05D3.","\u05DE\u05D5\u05DE\u05DC\u05E5 \u05DC\u05E2\u05E7\u05D5\u05D1 \u05D0\u05D7\u05E8\u05D9 \u05D4\u05DE\u05D2\u05DE\u05D4: \u05D9\u05D5\u05DD \u05E8\u05E2 \u05D0\u05D7\u05D3 \u05E4\u05D7\u05D5\u05EA \u05D7\u05E9\u05D5\u05D1 \u05DE\u05E9\u05DC\u05D5\u05E9\u05D4 \u05D1\u05E8\u05E6\u05E3."]}},{id:"recovery-numbers",roles:u,en:{title:"What recovery and sleep numbers mean",keys:["recovery and sleep numbers","recovery numbers","sleep numbers","recovery score","recovery percent","what do my numbers","numbers really tell"],body:["Recovery and sleep scores are estimates built from resting heart rate, heart-rate variability (HRV), sleep duration and sleep stages.","- They are **relative to your own baseline,** so compare yourself to your last few weeks, not to other people.","- Day-to-day swings are normal. A **trend over several days** is worth attention; a single low number usually is not.","- Alcohol, illness, travel, late meals and stress all move them, so look for the likely cause before reacting.","- How you feel and how you perform matter as much as the score. If the two disagree, trust the whole picture and tell your staff.","They are not a medical test and cannot tell you whether you are injured or ready to play."]},he:{title:"\u05DE\u05D4 \u05D0\u05D5\u05DE\u05E8\u05D9\u05DD \u05DE\u05E1\u05E4\u05E8\u05D9 \u05D4\u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA \u05D5\u05D4\u05E9\u05D9\u05E0\u05D4",keys:["\u05DE\u05E1\u05E4\u05E8\u05D9 \u05D4\u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA","\u05DE\u05E1\u05E4\u05E8\u05D9 \u05D4\u05E9\u05D9\u05E0\u05D4","\u05E6\u05D9\u05D5\u05DF \u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA","\u05D0\u05D7\u05D5\u05D6 \u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA","\u05DE\u05D4 \u05D4\u05DE\u05E1\u05E4\u05E8\u05D9\u05DD","\u05D1\u05D0\u05DE\u05EA \u05D0\u05D5\u05DE\u05E8\u05D9\u05DD"],body:["\u05E6\u05D9\u05D5\u05E0\u05D9 \u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA \u05D5\u05E9\u05D9\u05E0\u05D4 \u05D4\u05DD \u05D4\u05E2\u05E8\u05DB\u05D5\u05EA \u05E9\u05DE\u05D1\u05D5\u05E1\u05E1\u05D5\u05EA \u05E2\u05DC \u05D3\u05D5\u05E4\u05E7 \u05DE\u05E0\u05D5\u05D7\u05D4, \u05E9\u05D5\u05E0\u05D5\u05EA \u05D3\u05D5\u05E4\u05E7 (HRV), \u05DE\u05E9\u05DA \u05E9\u05D9\u05E0\u05D4 \u05D5\u05E9\u05DC\u05D1\u05D9 \u05E9\u05D9\u05E0\u05D4.","- \u05D4\u05DD **\u05D9\u05D7\u05E1\u05D9\u05D9\u05DD \u05DC\u05D1\u05E1\u05D9\u05E1 \u05D4\u05D0\u05D9\u05E9\u05D9 \u05E9\u05DC\u05DB\u05DD:** \u05DE\u05E9\u05D5\u05D5\u05D9\u05DD \u05DC\u05E9\u05D1\u05D5\u05E2\u05D5\u05EA \u05D4\u05D0\u05D7\u05E8\u05D5\u05E0\u05D9\u05DD \u05E9\u05DC\u05DB\u05DD, \u05DC\u05D0 \u05DC\u05D0\u05E0\u05E9\u05D9\u05DD \u05D0\u05D7\u05E8\u05D9\u05DD.","- \u05EA\u05E0\u05D5\u05D3\u05D5\u05EA \u05DE\u05D9\u05D5\u05DD \u05DC\u05D9\u05D5\u05DD \u05D4\u05DF \u05E0\u05D5\u05E8\u05DE\u05DC\u05D9\u05D5\u05EA. **\u05DE\u05D2\u05DE\u05D4 \u05DC\u05D0\u05D5\u05E8\u05DA \u05DB\u05DE\u05D4 \u05D9\u05DE\u05D9\u05DD** \u05E8\u05D0\u05D5\u05D9\u05D4 \u05DC\u05EA\u05E9\u05D5\u05DE\u05EA \u05DC\u05D1; \u05DE\u05E1\u05E4\u05E8 \u05E0\u05DE\u05D5\u05DA \u05D1\u05D5\u05D3\u05D3 \u05D1\u05D3\u05E8\u05DA \u05DB\u05DC\u05DC \u05DC\u05D0.","- \u05D0\u05DC\u05DB\u05D5\u05D4\u05D5\u05DC, \u05DE\u05D7\u05DC\u05D4, \u05E0\u05E1\u05D9\u05E2\u05D5\u05EA, \u05D0\u05E8\u05D5\u05D7\u05D5\u05EA \u05DE\u05D0\u05D5\u05D7\u05E8\u05D5\u05EA \u05D5\u05DC\u05D7\u05E5 \u05DE\u05E9\u05E0\u05D9\u05DD \u05D0\u05D5\u05EA\u05DD, \u05DC\u05DB\u05DF \u05DB\u05D3\u05D0\u05D9 \u05DC\u05D7\u05E4\u05E9 \u05D0\u05EA \u05D4\u05E1\u05D9\u05D1\u05D4 \u05D4\u05E1\u05D1\u05D9\u05E8\u05D4 \u05DC\u05E4\u05E0\u05D9 \u05E9\u05DE\u05D2\u05D9\u05D1\u05D9\u05DD.","- \u05D4\u05EA\u05D7\u05D5\u05E9\u05D4 \u05D5\u05D4\u05D1\u05D9\u05E6\u05D5\u05E2\u05D9\u05DD \u05D7\u05E9\u05D5\u05D1\u05D9\u05DD \u05DB\u05DE\u05D5 \u05D4\u05E6\u05D9\u05D5\u05DF. \u05D0\u05DD \u05D4\u05DD \u05DC\u05D0 \u05DE\u05E1\u05DB\u05D9\u05DE\u05D9\u05DD, \u05DE\u05E1\u05EA\u05DB\u05DC\u05D9\u05DD \u05E2\u05DC \u05D4\u05EA\u05DE\u05D5\u05E0\u05D4 \u05DB\u05D5\u05DC\u05D4 \u05D5\u05DE\u05E2\u05D3\u05DB\u05E0\u05D9\u05DD \u05D0\u05EA \u05D4\u05E6\u05D5\u05D5\u05EA.","\u05D6\u05D5 \u05DC\u05D0 \u05D1\u05D3\u05D9\u05E7\u05D4 \u05E8\u05E4\u05D5\u05D0\u05D9\u05EA \u05D5\u05D4\u05D9\u05D0 \u05DC\u05D0 \u05D9\u05DB\u05D5\u05DC\u05D4 \u05DC\u05E7\u05D1\u05D5\u05E2 \u05D0\u05DD \u05E0\u05E4\u05E6\u05E2\u05EA\u05DD \u05D0\u05D5 \u05D0\u05DD \u05D0\u05EA\u05DD \u05DE\u05D5\u05DB\u05E0\u05D9\u05DD \u05DC\u05E9\u05D7\u05E7."]}},{id:"hrv-decisions",roles:y,en:{title:"Using recovery and HRV data in decisions",keys:["hrv","heart rate variability","recovery data","without over-trusting","over-trust","resting heart rate"],body:["Treat HRV and recovery scores as **one input, not a verdict:**","- Compare each athlete with **their own rolling baseline** (for example seven days against the last four weeks), never with the squad average.","- Look at **trends and several days together;** a single reading is noisy.","- Keep measurement conditions the same (time, position, device) and watch for missing data before reading a drop as meaningful.","- Combine with wellness answers, training load and context (travel, exams, illness). Agreement between sources is a strong signal; disagreement is a reason to talk to the athlete.","- Use it to **start a conversation or adjust a session,** not to withdraw an athlete on a number alone."]},he:{title:"\u05E9\u05D9\u05DE\u05D5\u05E9 \u05D1\u05E0\u05EA\u05D5\u05E0\u05D9 \u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA \u05D5-HRV \u05D1\u05D4\u05D7\u05DC\u05D8\u05D5\u05EA",keys:["hrv","\u05E9\u05D5\u05E0\u05D5\u05EA \u05D3\u05D5\u05E4\u05E7","\u05E0\u05EA\u05D5\u05E0\u05D9 \u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA","\u05D1\u05DC\u05D9 \u05DC\u05D4\u05E1\u05EA\u05DE\u05DA","\u05DC\u05D4\u05E1\u05EA\u05DE\u05DA \u05E2\u05DC \u05DE\u05E1\u05E4\u05E8","\u05D3\u05D5\u05E4\u05E7 \u05DE\u05E0\u05D5\u05D7\u05D4"],body:["\u05DE\u05EA\u05D9\u05D9\u05D7\u05E1\u05D9\u05DD \u05DC-HRV \u05D5\u05DC\u05E6\u05D9\u05D5\u05E0\u05D9 \u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA \u05DB**\u05E0\u05EA\u05D5\u05DF \u05D0\u05D7\u05D3, \u05DC\u05D0 \u05DB\u05E4\u05E1\u05E7 \u05D3\u05D9\u05DF:**","- \u05DE\u05E9\u05D5\u05D5\u05D9\u05DD \u05DB\u05DC \u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9 \u05DC**\u05D1\u05E1\u05D9\u05E1 \u05D4\u05E0\u05E2 \u05E9\u05DC\u05D5** (\u05DC\u05DE\u05E9\u05DC \u05E9\u05D1\u05E2\u05D4 \u05D9\u05DE\u05D9\u05DD \u05DE\u05D5\u05DC \u05D0\u05E8\u05D1\u05E2\u05EA \u05D4\u05E9\u05D1\u05D5\u05E2\u05D5\u05EA \u05D4\u05D0\u05D7\u05E8\u05D5\u05E0\u05D9\u05DD), \u05DC\u05D0 \u05DC\u05DE\u05DE\u05D5\u05E6\u05E2 \u05D4\u05E7\u05D1\u05D5\u05E6\u05D4.","- \u05DE\u05E1\u05EA\u05DB\u05DC\u05D9\u05DD \u05E2\u05DC **\u05DE\u05D2\u05DE\u05D5\u05EA \u05D5\u05E2\u05DC \u05DB\u05DE\u05D4 \u05D9\u05DE\u05D9\u05DD \u05D1\u05D9\u05D7\u05D3;** \u05DE\u05D3\u05D9\u05D3\u05D4 \u05D1\u05D5\u05D3\u05D3\u05EA \u05E8\u05D5\u05E2\u05E9\u05EA.","- \u05E9\u05D5\u05DE\u05E8\u05D9\u05DD \u05E2\u05DC \u05EA\u05E0\u05D0\u05D9 \u05DE\u05D3\u05D9\u05D3\u05D4 \u05D6\u05D4\u05D9\u05DD (\u05E9\u05E2\u05D4, \u05EA\u05E0\u05D5\u05D7\u05D4, \u05DE\u05DB\u05E9\u05D9\u05E8) \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D0\u05DD \u05D7\u05E1\u05E8\u05D9\u05DD \u05E0\u05EA\u05D5\u05E0\u05D9\u05DD \u05DC\u05E4\u05E0\u05D9 \u05E9\u05DE\u05E4\u05E8\u05E9\u05D9\u05DD \u05D9\u05E8\u05D9\u05D3\u05D4 \u05DB\u05DE\u05E9\u05DE\u05E2\u05D5\u05EA\u05D9\u05EA.","- \u05DE\u05E9\u05DC\u05D1\u05D9\u05DD \u05E2\u05DD \u05E9\u05D0\u05DC\u05D5\u05DF \u05D4\u05E8\u05D5\u05D5\u05D7\u05D4, \u05E2\u05D5\u05DE\u05E1 \u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD \u05D5\u05D4\u05E7\u05E9\u05E8 (\u05E0\u05E1\u05D9\u05E2\u05D5\u05EA, \u05DE\u05D1\u05D7\u05E0\u05D9\u05DD, \u05DE\u05D7\u05DC\u05D4). \u05D4\u05E1\u05DB\u05DE\u05D4 \u05D1\u05D9\u05DF \u05DE\u05E7\u05D5\u05E8\u05D5\u05EA \u05D4\u05D9\u05D0 \u05E1\u05D9\u05DE\u05DF \u05D7\u05D6\u05E7; \u05E4\u05E2\u05E8 \u05D4\u05D5\u05D0 \u05E1\u05D9\u05D1\u05D4 \u05DC\u05E9\u05D5\u05D7\u05D7 \u05E2\u05DD \u05D4\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9.","- \u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1\u05D6\u05D4 \u05DB\u05D3\u05D9 **\u05DC\u05E4\u05EA\u05D5\u05D7 \u05E9\u05D9\u05D7\u05D4 \u05D0\u05D5 \u05DC\u05D4\u05EA\u05D0\u05D9\u05DD \u05D0\u05D9\u05DE\u05D5\u05DF,** \u05DC\u05D0 \u05DB\u05D3\u05D9 \u05DC\u05D4\u05D5\u05E6\u05D9\u05D0 \u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9 \u05E2\u05DC \u05E1\u05DE\u05DA \u05DE\u05E1\u05E4\u05E8 \u05D1\u05DC\u05D1\u05D3."]}},{id:"sleep",roles:u,en:{title:"Sleep for athletes",keys:["sleep","sleeping","bedtime","insomnia","nap","can't sleep","cannot sleep"],body:["Sleep is the cheapest performance and recovery tool you have.","- Aim for roughly **8 to 10 hours for teenagers and 7 to 9 for adults;** many athletes need the upper end.","- Keep **regular times,** including weekends. Consistency matters as much as the total.","- Dim screens and lights for the last hour; keep the room dark, cool and quiet.","- Stop caffeine roughly 8 hours before bed. Avoid heavy meals and alcohol late.","- After late matches, wind down with a light snack, a shower and the same routine, then protect the next night.","- A nap of 20 to 30 minutes in the early afternoon helps without hurting night sleep.","If poor sleep lasts more than a couple of weeks, talk to a doctor."]},he:{title:"\u05E9\u05D9\u05E0\u05D4 \u05DC\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9\u05DD",keys:["\u05E9\u05D9\u05E0\u05D4","\u05DC\u05D9\u05E9\u05D5\u05DF","\u05E9\u05E2\u05EA \u05E9\u05D9\u05E0\u05D4","\u05E0\u05D3\u05D5\u05D3\u05D9 \u05E9\u05D9\u05E0\u05D4","\u05EA\u05E0\u05D5\u05DE\u05D4","\u05DC\u05D0 \u05E0\u05E8\u05D3\u05DD","\u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D9\u05E9\u05D5\u05DF"],body:["\u05E9\u05D9\u05E0\u05D4 \u05D4\u05D9\u05D0 \u05DB\u05DC\u05D9 \u05D4\u05D1\u05D9\u05E6\u05D5\u05E2\u05D9\u05DD \u05D5\u05D4\u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA \u05D4\u05D6\u05D5\u05DC \u05D1\u05D9\u05D5\u05EA\u05E8 \u05E9\u05D9\u05E9 \u05DC\u05DB\u05DD.","- \u05E9\u05D5\u05D0\u05E4\u05D9\u05DD \u05D1\u05E2\u05E8\u05DA \u05DC**8 \u05E2\u05D3 10 \u05E9\u05E2\u05D5\u05EA \u05DC\u05E0\u05D5\u05E2\u05E8 \u05D5-7 \u05E2\u05D3 9 \u05DC\u05D1\u05D5\u05D2\u05E8\u05D9\u05DD;** \u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9\u05DD \u05E8\u05D1\u05D9\u05DD \u05E6\u05E8\u05D9\u05DB\u05D9\u05DD \u05D0\u05EA \u05D4\u05E7\u05E6\u05D4 \u05D4\u05E2\u05DC\u05D9\u05D5\u05DF.","- \u05E9\u05D5\u05DE\u05E8\u05D9\u05DD \u05E2\u05DC **\u05E9\u05E2\u05D5\u05EA \u05E7\u05D1\u05D5\u05E2\u05D5\u05EA,** \u05D2\u05DD \u05D1\u05E1\u05D5\u05E4\u05D9 \u05E9\u05D1\u05D5\u05E2. \u05E2\u05E7\u05D1\u05D9\u05D5\u05EA \u05D7\u05E9\u05D5\u05D1\u05D4 \u05DB\u05DE\u05D5 \u05D4\u05DB\u05DE\u05D5\u05EA.","- \u05DE\u05E2\u05DE\u05E2\u05DE\u05D9\u05DD \u05DE\u05E1\u05DB\u05D9\u05DD \u05D5\u05D0\u05D5\u05E8 \u05D1\u05E9\u05E2\u05D4 \u05D4\u05D0\u05D7\u05E8\u05D5\u05E0\u05D4; \u05D7\u05D3\u05E8 \u05D7\u05E9\u05D5\u05DA, \u05E7\u05E8\u05D9\u05E8 \u05D5\u05E9\u05E7\u05D8.","- \u05DE\u05E4\u05E1\u05D9\u05E7\u05D9\u05DD \u05E7\u05E4\u05D0\u05D9\u05DF \u05DB-8 \u05E9\u05E2\u05D5\u05EA \u05DC\u05E4\u05E0\u05D9 \u05D4\u05E9\u05D9\u05E0\u05D4. \u05E0\u05DE\u05E0\u05E2\u05D9\u05DD \u05DE\u05D0\u05E8\u05D5\u05D7\u05D5\u05EA \u05DB\u05D1\u05D3\u05D5\u05EA \u05D5\u05D0\u05DC\u05DB\u05D5\u05D4\u05D5\u05DC \u05DE\u05D0\u05D5\u05D7\u05E8.","- \u05D0\u05D7\u05E8\u05D9 \u05DE\u05E9\u05D7\u05E7 \u05DE\u05D0\u05D5\u05D7\u05E8: \u05D7\u05D8\u05D9\u05E3 \u05E7\u05DC, \u05DE\u05E7\u05DC\u05D7\u05EA \u05D5\u05E9\u05D2\u05E8\u05D4 \u05E7\u05D1\u05D5\u05E2\u05D4, \u05D5\u05D0\u05D6 \u05E9\u05D5\u05DE\u05E8\u05D9\u05DD \u05E2\u05DC \u05D4\u05DC\u05D9\u05DC\u05D4 \u05D4\u05D1\u05D0.","- \u05EA\u05E0\u05D5\u05DE\u05D4 \u05E9\u05DC 20 \u05E2\u05D3 30 \u05D3\u05E7\u05D5\u05EA \u05D1\u05E6\u05D4\u05E8\u05D9\u05D9\u05DD \u05E2\u05D5\u05D6\u05E8\u05EA \u05D1\u05DC\u05D9 \u05DC\u05E4\u05D2\u05D5\u05E2 \u05D1\u05E9\u05D9\u05E0\u05D4 \u05D1\u05DC\u05D9\u05DC\u05D4.","\u05D0\u05DD \u05E9\u05D9\u05E0\u05D4 \u05D2\u05E8\u05D5\u05E2\u05D4 \u05E0\u05DE\u05E9\u05DB\u05EA \u05D9\u05D5\u05EA\u05E8 \u05DE\u05DB\u05DE\u05D4 \u05E9\u05D1\u05D5\u05E2\u05D5\u05EA, \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E4\u05E0\u05D5\u05EA \u05DC\u05E8\u05D5\u05E4\u05D0."]}},{id:"nutrition-hydration",roles:u,en:{title:"Nutrition and hydration basics",keys:["nutrition","eat","eating","food","diet","hydration","hydrate","drink","protein","carbohydrate","carbs","supplement"],body:["General guidance only; a sports dietitian can tailor it.","- **Carbohydrate is the main fuel** for matches and hard sessions: build meals around it on heavy days, and eat a carbohydrate-rich meal 3 to 4 hours before a match.","- **Protein:** about 1.4 to 2.0 g per kg of body weight a day, spread over 3 to 5 meals, is a common target for athletes.","- **Fluids:** drink through the day and aim for pale-yellow urine; add fluids with sodium in long, hot sessions.","- **Eat after training** within a couple of hours, especially if there is another session soon.","- Supplements are rarely the answer. Check anything you take against anti-doping rules before using it, and prefer products with independent batch testing.","Young athletes should not diet to lose weight without a professional."]},he:{title:"\u05D9\u05E1\u05D5\u05D3\u05D5\u05EA \u05EA\u05D6\u05D5\u05E0\u05D4 \u05D5\u05D4\u05D9\u05D3\u05E8\u05E6\u05D9\u05D4",keys:["\u05EA\u05D6\u05D5\u05E0\u05D4","\u05DC\u05D0\u05DB\u05D5\u05DC","\u05D0\u05D5\u05DB\u05DC","\u05D3\u05D9\u05D0\u05D8\u05D4","\u05D4\u05D9\u05D3\u05E8\u05E6\u05D9\u05D4","\u05DC\u05E9\u05EA\u05D5\u05EA","\u05E9\u05EA\u05D9\u05D9\u05D4","\u05D7\u05DC\u05D1\u05D5\u05DF","\u05E4\u05D7\u05DE\u05D9\u05DE\u05D5\u05EA","\u05EA\u05D5\u05E1\u05E3","\u05EA\u05D5\u05E1\u05E4\u05D9"],body:["\u05D4\u05E0\u05D7\u05D9\u05D5\u05EA \u05DB\u05DC\u05DC\u05D9\u05D5\u05EA \u05D1\u05DC\u05D1\u05D3; \u05EA\u05D6\u05D5\u05E0\u05D0\u05D9 \u05E1\u05E4\u05D5\u05E8\u05D8 \u05D9\u05DB\u05D5\u05DC \u05DC\u05D4\u05EA\u05D0\u05D9\u05DD \u05D0\u05D5\u05EA\u05DF \u05D0\u05D9\u05E9\u05D9\u05EA.","- **\u05E4\u05D7\u05DE\u05D9\u05DE\u05D5\u05EA \u05D4\u05DF \u05D4\u05D3\u05DC\u05E7 \u05D4\u05E2\u05D9\u05E7\u05E8\u05D9** \u05DC\u05DE\u05E9\u05D7\u05E7\u05D9\u05DD \u05D5\u05DC\u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD \u05E7\u05E9\u05D9\u05DD: \u05D1\u05D5\u05E0\u05D9\u05DD \u05E1\u05D1\u05D9\u05D1\u05DF \u05D0\u05EA \u05D4\u05D0\u05E8\u05D5\u05D7\u05D5\u05EA \u05D1\u05D9\u05DE\u05D9\u05DD \u05DB\u05D1\u05D3\u05D9\u05DD, \u05D5\u05D0\u05D5\u05DB\u05DC\u05D9\u05DD \u05D0\u05E8\u05D5\u05D7\u05D4 \u05E2\u05E9\u05D9\u05E8\u05D4 \u05D1\u05E4\u05D7\u05DE\u05D9\u05DE\u05D5\u05EA 3 \u05E2\u05D3 4 \u05E9\u05E2\u05D5\u05EA \u05DC\u05E4\u05E0\u05D9 \u05DE\u05E9\u05D7\u05E7.","- **\u05D7\u05DC\u05D1\u05D5\u05DF:** \u05DB-1.4 \u05E2\u05D3 2.0 \u05D2\u05E8\u05DD \u05DC\u05E7\u05F4\u05D2 \u05D2\u05D5\u05E3 \u05D1\u05D9\u05D5\u05DD, \u05DE\u05E4\u05D5\u05D6\u05E8 \u05E2\u05DC 3 \u05E2\u05D3 5 \u05D0\u05E8\u05D5\u05D7\u05D5\u05EA, \u05D4\u05D5\u05D0 \u05D9\u05E2\u05D3 \u05E0\u05E4\u05D5\u05E5 \u05DC\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9\u05DD.","- **\u05E0\u05D5\u05D6\u05DC\u05D9\u05DD:** \u05E9\u05D5\u05EA\u05D9\u05DD \u05DC\u05D0\u05D5\u05E8\u05DA \u05D4\u05D9\u05D5\u05DD \u05D5\u05E9\u05D5\u05D0\u05E4\u05D9\u05DD \u05DC\u05E9\u05EA\u05DF \u05E6\u05D4\u05D5\u05D1 \u05D1\u05D4\u05D9\u05E8; \u05D1\u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD \u05D0\u05E8\u05D5\u05DB\u05D9\u05DD \u05D5\u05D7\u05DE\u05D9\u05DD \u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05E0\u05D5\u05D6\u05DC\u05D9\u05DD \u05E2\u05DD \u05E0\u05EA\u05E8\u05DF.","- **\u05D0\u05D5\u05DB\u05DC\u05D9\u05DD \u05D0\u05D7\u05E8\u05D9 \u05D0\u05D9\u05DE\u05D5\u05DF** \u05D1\u05EA\u05D5\u05DA \u05E9\u05E2\u05EA\u05D9\u05D9\u05DD, \u05D1\u05DE\u05D9\u05D5\u05D7\u05D3 \u05D0\u05DD \u05D9\u05E9 \u05E2\u05D5\u05D3 \u05D0\u05D9\u05DE\u05D5\u05DF \u05D1\u05E7\u05E8\u05D5\u05D1.","- \u05EA\u05D5\u05E1\u05E4\u05D9\u05DD \u05D4\u05DD \u05DC\u05E2\u05D9\u05EA\u05D9\u05DD \u05E0\u05D3\u05D9\u05E8\u05D5\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4. \u05DC\u05E4\u05E0\u05D9 \u05E9\u05D9\u05DE\u05D5\u05E9 \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05DE\u05D5\u05DC \u05DB\u05DC\u05DC\u05D9 \u05D0\u05E0\u05D8\u05D9-\u05D3\u05D5\u05E4\u05D9\u05E0\u05D2, \u05D5\u05DE\u05E2\u05D3\u05D9\u05E4\u05D9\u05DD \u05DE\u05D5\u05E6\u05E8\u05D9\u05DD \u05E2\u05DD \u05D1\u05D3\u05D9\u05E7\u05EA \u05D0\u05E6\u05D5\u05D5\u05EA \u05E2\u05E6\u05DE\u05D0\u05D9\u05EA.","\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9\u05DD \u05E6\u05E2\u05D9\u05E8\u05D9\u05DD \u05DC\u05D0 \u05E6\u05E8\u05D9\u05DB\u05D9\u05DD \u05DC\u05E2\u05E9\u05D5\u05EA \u05D3\u05D9\u05D0\u05D8\u05D4 \u05DC\u05D4\u05D5\u05E8\u05D3\u05EA \u05DE\u05E9\u05E7\u05DC \u05DC\u05DC\u05D0 \u05D0\u05D9\u05E9 \u05DE\u05E7\u05E6\u05D5\u05E2."]}},{id:"warmup",roles:u,en:{title:"Warm-up structure",keys:["warm up","warm-up","warmup","prepare before","before training","ramp"],body:["A good warm-up takes 10 to 20 minutes and follows the **RAMP** idea:","1. **Raise** heart rate and temperature with easy jogging, skipping or mobility flows.","2. **Activate and mobilise** the joints and muscles you are about to use (hips, ankles, trunk, shoulders).","3. **Potentiate** with progressively faster or more explosive drills: short accelerations, low jumps, light sets of the main lift.","Keep static stretching for after training; long holds before sprinting or jumping can reduce power. Warm up longer in the cold and shorter before easy sessions.","To add one to a session, open the session in **Training** and use the library or **Auto-build session**."]},he:{title:"\u05DE\u05D1\u05E0\u05D4 \u05D7\u05D9\u05DE\u05D5\u05DD",keys:["\u05D7\u05D9\u05DE\u05D5\u05DD","\u05DC\u05D4\u05EA\u05D7\u05DE\u05DD","\u05DE\u05EA\u05D7\u05DE\u05DE\u05D9\u05DD","\u05DE\u05EA\u05D7\u05DE\u05DD","\u05D4\u05EA\u05D7\u05DE\u05DE\u05D5\u05EA","\u05DC\u05E4\u05E0\u05D9 \u05D0\u05D9\u05DE\u05D5\u05DF","ramp"],body:["\u05D7\u05D9\u05DE\u05D5\u05DD \u05D8\u05D5\u05D1 \u05E0\u05DE\u05E9\u05DA 10 \u05E2\u05D3 20 \u05D3\u05E7\u05D5\u05EA \u05D5\u05E4\u05D5\u05E2\u05DC \u05DC\u05E4\u05D9 \u05E8\u05E2\u05D9\u05D5\u05DF \u05D4-**RAMP:**","1. **\u05DC\u05D4\u05E2\u05DC\u05D5\u05EA** \u05D3\u05D5\u05E4\u05E7 \u05D5\u05D8\u05DE\u05E4\u05E8\u05D8\u05D5\u05E8\u05D4 \u05D1\u05E8\u05D9\u05E6\u05D4 \u05E7\u05DC\u05D4, \u05D3\u05D9\u05DC\u05D5\u05D2\u05D9\u05DD \u05D0\u05D5 \u05D6\u05E8\u05D9\u05DE\u05D5\u05EA \u05E0\u05D9\u05D9\u05D3\u05D5\u05EA.","2. **\u05DC\u05D4\u05E4\u05E2\u05D9\u05DC \u05D5\u05DC\u05E9\u05D7\u05E8\u05E8** \u05D0\u05EA \u05D4\u05DE\u05E4\u05E8\u05E7\u05D9\u05DD \u05D5\u05D4\u05E9\u05E8\u05D9\u05E8\u05D9\u05DD \u05E9\u05D1\u05D4\u05DD \u05EA\u05E9\u05EA\u05DE\u05E9\u05D5 (\u05D9\u05E8\u05DB\u05D9\u05D9\u05DD, \u05E7\u05E8\u05E1\u05D5\u05DC\u05D9\u05D9\u05DD, \u05D2\u05D5, \u05DB\u05EA\u05E4\u05D9\u05D9\u05DD).","3. **\u05DC\u05D4\u05DB\u05D9\u05DF \u05DC\u05E2\u05D5\u05E6\u05DE\u05D4** \u05D1\u05EA\u05E8\u05D2\u05D9\u05DC\u05D9\u05DD \u05DE\u05D4\u05D9\u05E8\u05D9\u05DD \u05D0\u05D5 \u05DE\u05EA\u05E4\u05E8\u05E6\u05D9\u05DD \u05D9\u05D5\u05EA\u05E8 \u05D1\u05D4\u05D3\u05E8\u05D2\u05D4: \u05D4\u05D0\u05E6\u05D5\u05EA \u05E7\u05E6\u05E8\u05D5\u05EA, \u05E7\u05E4\u05D9\u05E6\u05D5\u05EA \u05E0\u05DE\u05D5\u05DB\u05D5\u05EA, \u05E1\u05D8\u05D9\u05DD \u05E7\u05DC\u05D9\u05DD \u05E9\u05DC \u05D4\u05EA\u05E8\u05D2\u05D9\u05DC \u05D4\u05DE\u05E8\u05DB\u05D6\u05D9.","\u05DE\u05EA\u05D9\u05D7\u05D5\u05EA \u05E1\u05D8\u05D8\u05D9\u05D5\u05EA \u05DE\u05E9\u05D0\u05D9\u05E8\u05D9\u05DD \u05DC\u05E1\u05D5\u05E3 \u05D4\u05D0\u05D9\u05DE\u05D5\u05DF; \u05D4\u05D7\u05D6\u05E7\u05D5\u05EA \u05D0\u05E8\u05D5\u05DB\u05D5\u05EA \u05DC\u05E4\u05E0\u05D9 \u05E1\u05E4\u05E8\u05D9\u05E0\u05D8 \u05D0\u05D5 \u05E7\u05E4\u05D9\u05E6\u05D5\u05EA \u05E2\u05DC\u05D5\u05DC\u05D5\u05EA \u05DC\u05D4\u05E4\u05D7\u05D9\u05EA \u05E2\u05D5\u05E6\u05DE\u05D4. \u05DE\u05EA\u05D7\u05DE\u05DE\u05D9\u05DD \u05D9\u05D5\u05EA\u05E8 \u05D1\u05E7\u05D5\u05E8 \u05D5\u05E4\u05D7\u05D5\u05EA \u05DC\u05E4\u05E0\u05D9 \u05D0\u05D9\u05DE\u05D5\u05DF \u05E7\u05DC.","\u05DB\u05D3\u05D9 \u05DC\u05D4\u05D5\u05E1\u05D9\u05E3 \u05D7\u05D9\u05DE\u05D5\u05DD \u05DC\u05D0\u05D9\u05DE\u05D5\u05DF, \u05E4\u05D5\u05EA\u05D7\u05D9\u05DD \u05D0\u05EA \u05D4\u05D0\u05D9\u05DE\u05D5\u05DF \u05D1**\u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD** \u05D5\u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1\u05E1\u05E4\u05E8\u05D9\u05D9\u05D4 \u05D0\u05D5 \u05D1**\u05D1\u05E0\u05D9\u05D9\u05EA \u05D0\u05D9\u05DE\u05D5\u05DF \u05D0\u05D5\u05D8\u05D5\u05DE\u05D8\u05D9\u05EA**."]}},{id:"acwr",roles:y,en:{title:"Acute:chronic workload ratio and its limits",keys:["acute chronic","acute:chronic","acwr","workload ratio","workload ratios","load ratio","acute load","chronic load","spike in load"],body:["The ratio compares the last 7 days of load with the 28-day weekly average. In this app a ratio **above 1.5** is flagged high and **below 0.8** low.","Useful as a **prompt to look closer,** but with known limits:","- The two windows overlap, so the ratio can mislead and the evidence that it predicts injury is weak.","- It ignores *what* the load was (sprinting and high-speed running, accelerations, contact) and the athlete's history.","- It breaks down with missing sessions, a new athlete, or a very low chronic base.","Also look at: **absolute load, week-to-week change, monotony,** high-speed and sprint exposure, wellness trend, age and injury history, and the context of the fixture list.",'Use a flag to ask a question ("why did load jump?") rather than to cut a session automatically. The **GPS** page shows the ratio and the dashboard raises alerts.']},he:{title:"\u05D9\u05D7\u05E1 \u05E2\u05D5\u05DE\u05E1 \u05D0\u05E7\u05D5\u05D8\u05D9:\u05DB\u05E8\u05D5\u05E0\u05D9 \u05D5\u05D4\u05DE\u05D2\u05D1\u05DC\u05D5\u05EA \u05E9\u05DC\u05D5",keys:["\u05D0\u05E7\u05D5\u05D8\u05D9 \u05DB\u05E8\u05D5\u05E0\u05D9","\u05D0\u05E7\u05D5\u05D8\u05D9:\u05DB\u05E8\u05D5\u05E0\u05D9","\u05D9\u05D7\u05E1 \u05E2\u05D5\u05DE\u05E1","\u05D9\u05D7\u05E1 \u05D4\u05E2\u05D5\u05DE\u05E1","acwr","\u05E2\u05D5\u05DE\u05E1 \u05D0\u05E7\u05D5\u05D8\u05D9","\u05E2\u05D5\u05DE\u05E1 \u05DB\u05E8\u05D5\u05E0\u05D9","\u05D6\u05D9\u05E0\u05D5\u05E7 \u05D1\u05E2\u05D5\u05DE\u05E1"],body:["\u05D4\u05D9\u05D7\u05E1 \u05DE\u05E9\u05D5\u05D5\u05D4 \u05D0\u05EA 7 \u05D4\u05D9\u05DE\u05D9\u05DD \u05D4\u05D0\u05D7\u05E8\u05D5\u05E0\u05D9\u05DD \u05DC\u05DE\u05DE\u05D5\u05E6\u05E2 \u05D4\u05E9\u05D1\u05D5\u05E2\u05D9 \u05E9\u05DC 28 \u05D4\u05D9\u05DE\u05D9\u05DD. \u05D1\u05D0\u05E4\u05DC\u05D9\u05E7\u05E6\u05D9\u05D4 \u05D9\u05D7\u05E1 **\u05DE\u05E2\u05DC 1.5** \u05DE\u05E1\u05D5\u05DE\u05DF \u05DB\u05D2\u05D1\u05D5\u05D4 \u05D5**\u05DE\u05EA\u05D7\u05EA \u05DC-0.8** \u05DB\u05E0\u05DE\u05D5\u05DA.","\u05E9\u05D9\u05DE\u05D5\u05E9\u05D9 \u05DB**\u05E1\u05D9\u05DE\u05DF \u05DC\u05D4\u05E1\u05EA\u05DB\u05DC \u05DE\u05E7\u05E8\u05D5\u05D1,** \u05D0\u05D1\u05DC \u05E2\u05DD \u05DE\u05D2\u05D1\u05DC\u05D5\u05EA \u05D9\u05D3\u05D5\u05E2\u05D5\u05EA:","- \u05D4\u05D7\u05DC\u05D5\u05E0\u05D5\u05EA \u05D7\u05D5\u05E4\u05E4\u05D9\u05DD, \u05D5\u05DC\u05DB\u05DF \u05D4\u05D9\u05D7\u05E1 \u05E2\u05DC\u05D5\u05DC \u05DC\u05D4\u05D8\u05E2\u05D5\u05EA, \u05D5\u05D4\u05E8\u05D0\u05D9\u05D5\u05EA \u05E9\u05D4\u05D5\u05D0 \u05DE\u05E0\u05D1\u05D0 \u05E4\u05E6\u05D9\u05E2\u05D4 \u05D7\u05DC\u05E9\u05D5\u05EA.","- \u05D4\u05D5\u05D0 \u05DE\u05EA\u05E2\u05DC\u05DD \u05DE*\u05E1\u05D5\u05D2* \u05D4\u05E2\u05D5\u05DE\u05E1 (\u05E1\u05E4\u05E8\u05D9\u05E0\u05D8\u05D9\u05DD, \u05E8\u05D9\u05E6\u05D4 \u05DE\u05D4\u05D9\u05E8\u05D4, \u05D4\u05D0\u05E6\u05D5\u05EA, \u05DE\u05D2\u05E2) \u05D5\u05DE\u05D4\u05D4\u05D9\u05E1\u05D8\u05D5\u05E8\u05D9\u05D4 \u05E9\u05DC \u05D4\u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9.","- \u05D4\u05D5\u05D0 \u05DE\u05EA\u05E4\u05E8\u05E7 \u05DB\u05E9\u05D7\u05E1\u05E8\u05D9\u05DD \u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD, \u05D0\u05E6\u05DC \u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9 \u05D7\u05D3\u05E9, \u05D0\u05D5 \u05DB\u05E9\u05D4\u05D1\u05E1\u05D9\u05E1 \u05D4\u05DB\u05E8\u05D5\u05E0\u05D9 \u05E0\u05DE\u05D5\u05DA \u05DE\u05D0\u05D5\u05D3.","\u05DB\u05D3\u05D0\u05D9 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05D2\u05DD: **\u05E2\u05D5\u05DE\u05E1 \u05DE\u05D5\u05D7\u05DC\u05D8, \u05E9\u05D9\u05E0\u05D5\u05D9 \u05DE\u05E9\u05D1\u05D5\u05E2 \u05DC\u05E9\u05D1\u05D5\u05E2, \u05DE\u05D5\u05E0\u05D5\u05D8\u05D5\u05E0\u05D9\u05D5\u05EA,** \u05D7\u05E9\u05D9\u05E4\u05D4 \u05DC\u05E8\u05D9\u05E6\u05D4 \u05DE\u05D4\u05D9\u05E8\u05D4 \u05D5\u05E1\u05E4\u05E8\u05D9\u05E0\u05D8, \u05DE\u05D2\u05DE\u05EA \u05E8\u05D5\u05D5\u05D7\u05D4, \u05D2\u05D9\u05DC \u05D5\u05D4\u05D9\u05E1\u05D8\u05D5\u05E8\u05D9\u05D9\u05EA \u05E4\u05E6\u05D9\u05E2\u05D5\u05EA, \u05D5\u05D4\u05E7\u05E9\u05E8 \u05DC\u05D5\u05D7 \u05D4\u05DE\u05E9\u05D7\u05E7\u05D9\u05DD.",'\u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1\u05E1\u05D9\u05DE\u05D5\u05DF \u05DB\u05D3\u05D9 \u05DC\u05E9\u05D0\u05D5\u05DC \u05E9\u05D0\u05DC\u05D4 ("\u05DC\u05DE\u05D4 \u05D4\u05E2\u05D5\u05DE\u05E1 \u05E7\u05E4\u05E5?") \u05D5\u05DC\u05D0 \u05DB\u05D3\u05D9 \u05DC\u05D1\u05D8\u05DC \u05D0\u05D9\u05DE\u05D5\u05DF \u05D0\u05D5\u05D8\u05D5\u05DE\u05D8\u05D9\u05EA. \u05E2\u05DE\u05D5\u05D3 \u05D4-**GPS** \u05DE\u05E6\u05D9\u05D2 \u05D0\u05EA \u05D4\u05D9\u05D7\u05E1 \u05D5\u05D4\u05D3\u05E9\u05D1\u05D5\u05E8\u05D3 \u05DE\u05E2\u05DC\u05D4 \u05D4\u05EA\u05E8\u05D0\u05D5\u05EA.']}},{id:"microcycle",roles:L,en:{title:"Planning a microcycle around matches",keys:["microcycle","micro-cycle","two matches","matches in one week","match week","midweek match","md-1","md-2","md-3","weekly plan","plan the week"],body:["Plan backwards from the match, using the **MD (match-day) code:**","- **MD+1:** recovery for starters (mobility, easy aerobic work); a top-up session for those who played little.","- **MD-4 to MD-3:** the heaviest day for strength, power and high-intensity work, when the next match is far enough away.","- **MD-2:** speed, tactical work and shorter, sharper drills; moderate volume.","- **MD-1:** short activation, set pieces and low volume. Nothing new, nothing tiring.","**Two matches in one week:** the first microcycle after match 1 is mostly recovery and one short high-quality exposure; protect sleep and refuelling, keep intensity but cut volume, and rotate where you can. Accept that the stimulus for fitness comes from the matches themselves.","Review the plan against readiness and GPS load during the week and adjust."]},he:{title:"\u05EA\u05DB\u05E0\u05D5\u05DF \u05DE\u05D9\u05E7\u05E8\u05D5-\u05DE\u05D7\u05D6\u05D5\u05E8 \u05E1\u05D1\u05D9\u05D1 \u05DE\u05E9\u05D7\u05E7\u05D9\u05DD",keys:["\u05DE\u05D9\u05E7\u05E8\u05D5 \u05DE\u05D7\u05D6\u05D5\u05E8","\u05DE\u05D9\u05E7\u05E8\u05D5-\u05DE\u05D7\u05D6\u05D5\u05E8","\u05DE\u05D9\u05E7\u05E8\u05D5\u05DE\u05D7\u05D6\u05D5\u05E8","\u05E9\u05E0\u05D9 \u05DE\u05E9\u05D7\u05E7\u05D9\u05DD","\u05DE\u05E9\u05D7\u05E7\u05D9\u05DD \u05D1\u05E9\u05D1\u05D5\u05E2","\u05E9\u05D1\u05D5\u05E2 \u05DE\u05E9\u05D7\u05E7","\u05DE\u05E9\u05D7\u05E7 \u05D0\u05DE\u05E6\u05E2 \u05E9\u05D1\u05D5\u05E2","\u05EA\u05DB\u05E0\u05D5\u05DF \u05E9\u05D1\u05D5\u05E2\u05D9","\u05DC\u05EA\u05DB\u05E0\u05DF \u05D0\u05EA \u05D4\u05E9\u05D1\u05D5\u05E2"],body:["\u05DE\u05EA\u05DB\u05E0\u05E0\u05D9\u05DD \u05D0\u05D7\u05D5\u05E8\u05D4 \u05DE\u05D4\u05DE\u05E9\u05D7\u05E7, \u05DC\u05E4\u05D9 \u05E7\u05D5\u05D3 **MD (\u05D9\u05D5\u05DD \u05DE\u05E9\u05D7\u05E7):**","- **MD+1:** \u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA \u05DC\u05E4\u05D5\u05EA\u05D7\u05D9\u05DD (\u05E0\u05D9\u05D9\u05D3\u05D5\u05EA, \u05E2\u05D1\u05D5\u05D3\u05D4 \u05D0\u05D9\u05E8\u05D5\u05D1\u05D9\u05EA \u05E7\u05DC\u05D4); \u05D0\u05D9\u05DE\u05D5\u05DF \u05D4\u05E9\u05DC\u05DE\u05D4 \u05DC\u05DE\u05D9 \u05E9\u05E9\u05D9\u05D7\u05E7 \u05DE\u05E2\u05D8.","- **MD-4 \u05E2\u05D3 MD-3:** \u05D4\u05D9\u05D5\u05DD \u05D4\u05DB\u05D1\u05D3 \u05D1\u05D9\u05D5\u05EA\u05E8 \u05DC\u05DB\u05D5\u05D7, \u05E2\u05D5\u05E6\u05DE\u05D4 \u05D5\u05E2\u05D1\u05D5\u05D3\u05D4 \u05D1\u05E2\u05E6\u05D9\u05DE\u05D5\u05EA \u05D2\u05D1\u05D5\u05D4\u05D4, \u05DB\u05E9\u05D4\u05DE\u05E9\u05D7\u05E7 \u05D4\u05D1\u05D0 \u05E8\u05D7\u05D5\u05E7 \u05DE\u05E1\u05E4\u05D9\u05E7.","- **MD-2:** \u05DE\u05D4\u05D9\u05E8\u05D5\u05EA, \u05E2\u05D1\u05D5\u05D3\u05D4 \u05D8\u05E7\u05D8\u05D9\u05EA \u05D5\u05EA\u05E8\u05D2\u05D9\u05DC\u05D9\u05DD \u05E7\u05E6\u05E8\u05D9\u05DD \u05D5\u05D7\u05D3\u05D9\u05DD \u05D9\u05D5\u05EA\u05E8; \u05E0\u05E4\u05D7 \u05D1\u05D9\u05E0\u05D5\u05E0\u05D9.","- **MD-1:** \u05D4\u05E4\u05E2\u05DC\u05D4 \u05E7\u05E6\u05E8\u05D4, \u05DE\u05E6\u05D1\u05D9\u05DD \u05E0\u05D9\u05D9\u05D7\u05D9\u05DD \u05D5\u05E0\u05E4\u05D7 \u05E0\u05DE\u05D5\u05DA. \u05E9\u05D5\u05DD \u05D3\u05D1\u05E8 \u05D7\u05D3\u05E9 \u05D5\u05E9\u05D5\u05DD \u05D3\u05D1\u05E8 \u05DE\u05E2\u05D9\u05D9\u05E3.","**\u05E9\u05E0\u05D9 \u05DE\u05E9\u05D7\u05E7\u05D9\u05DD \u05D1\u05E9\u05D1\u05D5\u05E2:** \u05D4\u05DE\u05D9\u05E7\u05E8\u05D5-\u05DE\u05D7\u05D6\u05D5\u05E8 \u05D0\u05D7\u05E8\u05D9 \u05D4\u05DE\u05E9\u05D7\u05E7 \u05D4\u05E8\u05D0\u05E9\u05D5\u05DF \u05D4\u05D5\u05D0 \u05D1\u05E2\u05D9\u05E7\u05E8 \u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA \u05D5\u05D7\u05E9\u05D9\u05E4\u05D4 \u05D0\u05D7\u05EA \u05E7\u05E6\u05E8\u05D4 \u05D1\u05D0\u05D9\u05DB\u05D5\u05EA \u05D2\u05D1\u05D5\u05D4\u05D4; \u05E9\u05D5\u05DE\u05E8\u05D9\u05DD \u05E2\u05DC \u05E9\u05D9\u05E0\u05D4 \u05D5\u05EA\u05D3\u05DC\u05D5\u05E7, \u05DE\u05E9\u05DE\u05E8\u05D9\u05DD \u05E2\u05E6\u05D9\u05DE\u05D5\u05EA \u05D5\u05DE\u05E7\u05E6\u05E6\u05D9\u05DD \u05E0\u05E4\u05D7, \u05D5\u05DE\u05D7\u05DC\u05D9\u05E4\u05D9\u05DD \u05E9\u05D7\u05E7\u05E0\u05D9\u05DD \u05D1\u05DE\u05D9\u05D3\u05EA \u05D4\u05D0\u05E4\u05E9\u05E8. \u05D4\u05D2\u05D9\u05E8\u05D5\u05D9 \u05DC\u05DB\u05D5\u05E9\u05E8 \u05DE\u05D2\u05D9\u05E2 \u05DE\u05D4\u05DE\u05E9\u05D7\u05E7\u05D9\u05DD \u05E2\u05E6\u05DE\u05DD.","\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D0\u05EA \u05D4\u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05DE\u05D5\u05DC \u05E8\u05D5\u05D5\u05D7\u05D4 \u05D5\u05E2\u05D5\u05DE\u05E1 GPS \u05D1\u05DE\u05D4\u05DC\u05DA \u05D4\u05E9\u05D1\u05D5\u05E2 \u05D5\u05DE\u05EA\u05D0\u05D9\u05DE\u05D9\u05DD."]}},{id:"taper-block",roles:[...L,"physiotherapist"],en:{title:"A training block with a taper",keys:["taper","tapering","four-week block","four week block","4 week block","key match","peak for","periodization","periodisation","training block","mesocycle"],body:["A common four-week shape:","1. **Weeks 1 to 3, build:** progressive loading with a clear focus (for example strength then power). Raise volume or load in small steps, about 5 to 10 percent a week, and make week 3 the peak.","2. **Week 4, taper:** keep **intensity and frequency,** cut **volume** by roughly 40 to 60 percent over the 7 to 14 days before the key match. Short sharp sprints and heavy-but-low-volume lifts keep sharpness.","3. In the last 48 hours: activation only, plenty of sleep and carbohydrate.","Check readiness and GPS load weekly. If athletes arrive already tired, shorten the build instead of pushing through. In-season, a team-sport taper is much smaller than in individual sports: often a lighter match week, not a full reduction."]},he:{title:"\u05D1\u05DC\u05D5\u05E7 \u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD \u05E2\u05DD \u05D8\u05D9\u05D9\u05E4\u05E8",keys:["\u05D8\u05D9\u05D9\u05E4\u05E8","\u05D8\u05D9\u05E4\u05E8","\u05D1\u05DC\u05D5\u05E7 \u05E9\u05DC \u05D0\u05E8\u05D1\u05E2\u05D4","\u05D1\u05DC\u05D5\u05E7 \u05D0\u05E8\u05D1\u05E2\u05D4","\u05DE\u05E9\u05D7\u05E7 \u05D7\u05E9\u05D5\u05D1","\u05DC\u05E9\u05D9\u05D0","\u05E4\u05E8\u05D9\u05D5\u05D3\u05D9\u05D6\u05E6\u05D9\u05D4","\u05DE\u05D7\u05D6\u05D5\u05E8 \u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD","\u05D1\u05DC\u05D5\u05E7 \u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD"],body:["\u05DE\u05D1\u05E0\u05D4 \u05E0\u05E4\u05D5\u05E5 \u05E9\u05DC \u05D0\u05E8\u05D1\u05E2\u05D4 \u05E9\u05D1\u05D5\u05E2\u05D5\u05EA:","1. **\u05E9\u05D1\u05D5\u05E2\u05D5\u05EA 1 \u05E2\u05D3 3, \u05D1\u05E0\u05D9\u05D9\u05D4:** \u05D4\u05E2\u05DE\u05E1\u05D4 \u05D4\u05D3\u05E8\u05D2\u05EA\u05D9\u05EA \u05E2\u05DD \u05DE\u05D9\u05E7\u05D5\u05D3 \u05D1\u05E8\u05D5\u05E8 (\u05DC\u05DE\u05E9\u05DC \u05DB\u05D5\u05D7 \u05D5\u05D0\u05D7\u05E8\u05D9\u05D5 \u05E2\u05D5\u05E6\u05DE\u05D4). \u05DE\u05E2\u05DC\u05D9\u05DD \u05E0\u05E4\u05D7 \u05D0\u05D5 \u05E2\u05D5\u05DE\u05E1 \u05D1\u05E6\u05E2\u05D3\u05D9\u05DD \u05E7\u05D8\u05E0\u05D9\u05DD, \u05DB-5 \u05E2\u05D3 10 \u05D0\u05D7\u05D5\u05D6 \u05D1\u05E9\u05D1\u05D5\u05E2, \u05D5\u05E9\u05D1\u05D5\u05E2 3 \u05D4\u05D5\u05D0 \u05D4\u05E9\u05D9\u05D0.","2. **\u05E9\u05D1\u05D5\u05E2 4, \u05D8\u05D9\u05D9\u05E4\u05E8:** \u05E9\u05D5\u05DE\u05E8\u05D9\u05DD \u05E2\u05DC **\u05E2\u05E6\u05D9\u05DE\u05D5\u05EA \u05D5\u05EA\u05D3\u05D9\u05E8\u05D5\u05EA,** \u05DE\u05E7\u05E6\u05E6\u05D9\u05DD **\u05E0\u05E4\u05D7** \u05D1\u05DB-40 \u05E2\u05D3 60 \u05D0\u05D7\u05D5\u05D6 \u05D1-7 \u05E2\u05D3 14 \u05D4\u05D9\u05DE\u05D9\u05DD \u05E9\u05DC\u05E4\u05E0\u05D9 \u05D4\u05DE\u05E9\u05D7\u05E7 \u05D4\u05D7\u05E9\u05D5\u05D1. \u05E1\u05E4\u05E8\u05D9\u05E0\u05D8\u05D9\u05DD \u05E7\u05E6\u05E8\u05D9\u05DD \u05D5\u05D7\u05D3\u05D9\u05DD \u05D5\u05D4\u05E8\u05DE\u05D5\u05EA \u05DB\u05D1\u05D3\u05D5\u05EA \u05D1\u05E0\u05E4\u05D7 \u05E0\u05DE\u05D5\u05DA \u05E9\u05D5\u05DE\u05E8\u05D9\u05DD \u05E2\u05DC \u05D7\u05D3\u05D5\u05EA.","3. \u05D1-48 \u05D4\u05E9\u05E2\u05D5\u05EA \u05D4\u05D0\u05D7\u05E8\u05D5\u05E0\u05D5\u05EA: \u05D4\u05E4\u05E2\u05DC\u05D4 \u05D1\u05DC\u05D1\u05D3, \u05D4\u05E8\u05D1\u05D4 \u05E9\u05D9\u05E0\u05D4 \u05D5\u05E4\u05D7\u05DE\u05D9\u05DE\u05D5\u05EA.","\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E8\u05D5\u05D5\u05D7\u05D4 \u05D5\u05E2\u05D5\u05DE\u05E1 GPS \u05DE\u05D3\u05D9 \u05E9\u05D1\u05D5\u05E2. \u05D0\u05DD \u05E1\u05E4\u05D5\u05E8\u05D8\u05D0\u05D9\u05DD \u05DE\u05D2\u05D9\u05E2\u05D9\u05DD \u05E2\u05D9\u05D9\u05E4\u05D9\u05DD, \u05DE\u05E7\u05E6\u05E8\u05D9\u05DD \u05D0\u05EA \u05D4\u05D1\u05E0\u05D9\u05D9\u05D4 \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05D3\u05D7\u05D5\u05E3. \u05D1\u05E2\u05D5\u05E0\u05EA \u05DE\u05E9\u05D7\u05E7\u05D9\u05DD \u05D8\u05D9\u05D9\u05E4\u05E8 \u05D1\u05E2\u05E0\u05E3 \u05E7\u05D1\u05D5\u05E6\u05EA\u05D9 \u05E7\u05D8\u05DF \u05D1\u05D4\u05E8\u05D1\u05D4 \u05DE\u05D0\u05E9\u05E8 \u05D1\u05E2\u05E0\u05E4\u05D9\u05DD \u05D0\u05D9\u05E9\u05D9\u05D9\u05DD: \u05DC\u05E8\u05D5\u05D1 \u05E9\u05D1\u05D5\u05E2 \u05DE\u05E9\u05D7\u05E7 \u05E7\u05DC \u05D9\u05D5\u05EA\u05E8, \u05DC\u05D0 \u05D4\u05E4\u05D7\u05EA\u05D4 \u05DE\u05DC\u05D0\u05D4."]}},{id:"fixture-congestion",roles:["director","head_coach","head_of_performance"],en:{title:"Short-term results versus workload risk",keys:["congested","fixture","fixtures","short-term results","workload risk","busy period","run of matches","many matches"],body:["Treat it as a **decision with named trade-offs,** not a feeling:","- Decide in advance which matches matter most and where you will accept more risk.","- **Protect minutes for the highest-load players:** rotate, use substitutes earlier, and plan who rests which match.","- Between games, **cut volume before intensity;** recovery, sleep and food come first.","- Watch the data that moves first: wellness trend, high-speed running and sprint exposure, and the workload ratio. Agree trigger points with the staff before the run starts.","- Write down the reasoning so the decision is shared by coaching, medical and performance staff.","Short-term gains from overusing a few players tend to be paid back later in availability."]},he:{title:"\u05EA\u05D5\u05E6\u05D0\u05D5\u05EA \u05DC\u05D8\u05D5\u05D5\u05D7 \u05E7\u05E6\u05E8 \u05DE\u05D5\u05DC \u05E1\u05D9\u05DB\u05D5\u05DF \u05E2\u05D5\u05DE\u05E1",keys:["\u05EA\u05E7\u05D5\u05E4\u05EA \u05DE\u05E9\u05D7\u05E7\u05D9\u05DD \u05E2\u05DE\u05D5\u05E1\u05D4","\u05DE\u05E9\u05D7\u05E7\u05D9\u05DD \u05E2\u05DE\u05D5\u05E1\u05D4","\u05E2\u05DE\u05D5\u05E1\u05D4","\u05DC\u05D5\u05D7 \u05DE\u05E9\u05D7\u05E7\u05D9\u05DD","\u05EA\u05D5\u05E6\u05D0\u05D5\u05EA \u
