# Netlify build settings (kept in code so they cannot drift from the dashboard).
# Vercel stays supported through vercel.json. On Netlify the two daily jobs run as scheduled functions in netlify/functions.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
